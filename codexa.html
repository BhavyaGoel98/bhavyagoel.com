function completionRequirements(item) {
  const missing=[];
  if(guidedCount(item)) {
    if((state.guided[item.id]||0)<guidedCount(item)) missing.push('finish the walkthrough');
    if(!state.attempts[item.id]?.passed) missing.push('pass the coding exercise');
  }
  if(!state.answers[item.id]?.correct) missing.push('answer the knowledge check correctly');
  return missing;
}
function updateCompletion(item) {
  const complete=$('#complete-lesson');
  if(!complete || state.done.includes(item.id)) return;

function wireGuide(item) {
  const region=$('#guided-lesson');
  if(!region) return;
  const steps=guidedSteps[item.id];
  function draw(focus=false) {
    const index=state.guided[item.id]||0;
    if(index>=steps.length) {
      region.innerHTML='<div class="guide-step"><div class="guide-header"><span class="eyebrow">Walkthrough complete</span></div><h2>Try it yourself</h2><p>Edit the code, run it, then check the practice exercise below the editor.</p><button class="btn primary" id="guide-editor">Open code editor</button></div>';
      const open=$('#guide-editor');

        $('[data-pane-button="code"]').click();
        $('#workspace-editor textarea').focus();
      };
      if(focus) open.focus();
      return;
    }
    const [title,body,question,correct,wrong,reason]=steps[index];
    const answers=index%2 ? [wrong,correct] : [correct,wrong];
    region.innerHTML=`<div class="guide-step"><div class="guide-header"><span class="eyebrow">Guided lesson</span><span class="small">Step ${index+1} of ${steps.length}</span></div><h2 tabindex="-1">${esc(title)}</h2><p>${esc(body)}</p>
      <strong>${esc(question)}</strong><div class="guide-options">${answers.map(answer=>`<button class="btn" data-guide-answer="${answer===correct}">${esc(answer)}</button>`).join('')}</div>
      <p class="guide-feedback" role="status"></p><button class="btn primary" id="guide-next" hidden>Continue →</button></div>`;
    if(focus) $('h2',region).focus();
    for(const button of $$('[data-guide-answer]',region)) button.onclick=()=>{
      const feedback=$('.guide-feedback',region);
      const passed=button.dataset.guideAnswer==='true';
      feedback.textContent=(passed?'Correct. ':'Try again. ')+reason;
      feedback.classList.toggle('good',passed);
      feedback.classList.toggle('bad',!passed);
      if(passed) {
        $('#guide-next').hidden=false;
        for(const choice of $$('[data-guide-answer]',region)) choice.disabled=true;
        $('#guide-next').focus();
      }
    };
    $('#guide-next').onclick=()=>{
      state.guided[item.id]=index+1;
      persist();
      draw(true);
      updateCompletion(item);
    };
  }
  draw();
}

function streak() {
  const day=new Date();
  const stamp=()=>[day.getFullYear(),day.getMonth()+1,day.getDate()].map(n=>String(n).padStart(2,'0')).join('-');
  if (!state.days.includes(stamp())) day.setDate(day.getDate()-1);
  let count=0;
  while (state.days.includes(stamp())) {count++;day.setDate(day.getDate()-1);}
  return count;
}

}
function parseBackup(value) {
  if (!value || typeof value!=='object') throw Error('Choose a Codexa or BG Code Tutor backup.');
  if(value.version!==1) {
    if(typeof value.prog!=='object'||value.prog===null||Array.isArray(value.prog)) throw Error('Unrecognized backup format.');
    return {...state,legacy:{name:String(value.profile?.name||'').slice(0,80),xp:Number(value.xp)||0,completed:Object.values(value.prog).flat().length}};
  }
  const next=blank();
  next.theme=value.theme==='light'?'light':'dark';
  next.experience=isExperience(value.experience)?value.experience:null;
  for(const [field,ids] of [['enrolled',courses.map(c=>c.id)],['done',Object.keys(lessonMap)]]) {
    if(!Array.isArray(value[field])) throw Error('The backup is missing '+field+'.');
    next[field]=[...new Set(value[field].filter(id=>ids.includes(id)))];
  }
  for(const l of lessons) {
    const guided=value.guided?.[l.id];
    if(Number.isSafeInteger(guided)&&guided>0&&guided<=guidedCount(l)) next.guided[l.id]=guided;
    for(const kind of ['lesson','challenge']) {
      const k=kind+'/'+l.id, draft=value.drafts?.[k];
      if(typeof draft==='string') next.drafts[k]=draft;
    }
    const attempt=value.attempts?.[l.id];
    if(Number.isSafeInteger(attempt?.count)&&attempt.count>=1) next.attempts[l.id]={count:attempt.count,passed:attempt.passed===true};
  }
  for(const id of [...Object.keys(lessonMap),...assessments.map(a=>'quiz/'+a.id)]) {
    const score=value.answers?.[id];
    if(Number.isSafeInteger(score?.tries)&&Number.isSafeInteger(score?.correct)&&score.correct>=0&&score.tries>=score.correct) next.answers[id]={tries:score.tries,correct:score.correct};
  }
  for(const p of projects) {
    const saved=value.projects?.[p.id];
    if(typeof saved?.code==='string' && typeof saved.savedAt==='string' && Number.isFinite(Date.parse(saved.savedAt))) next.projects[p.id]={code:saved.code,savedAt:saved.savedAt};
  }
  if(typeof value.last==='string'&&Object.hasOwn(lessonMap,value.last)) next.last=value.last;
  if(Array.isArray(value.activity)) next.activity=value.activity.filter(a=>typeof a?.text==='string'&&typeof a.time==='string').slice(0,30).map(a=>({text:a.text.slice(0,250),time:a.time}));
  if(Array.isArray(value.days)) next.days=[...new Set(value.days.filter(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)))];
  if(value.legacy&&typeof value.legacy==='object') next.legacy={name:String(value.legacy.name||'').slice(0,80),xp:Number(value.legacy.xp)||0,completed:Number(value.legacy.completed)||0};
  return next;
}
function wireProgress() {
  $('#export').onclick=()=>download('codexa-progress.json',JSON.stringify(state,null,2),'application/json');
  const file=$('#backup-file');
  $('#import').onclick=()=>file.click();
  file.onchange=async()=>{
    if(!file.files.length) return;
    try {
      if(file.files[0].size>5_000_000) throw Error('Backup exceeds 5 MB.');
      const raw=JSON.parse(await file.files[0].text());
      const next=parseBackup(raw);
      if(!confirm(raw.version===1?'Replace the current Codexa progress with this backup?':'Import the original BG Code Tutor summary?')) return;
      state=next;persist();theme();render();notify('Backup imported.');
    } catch(error) {notify(error.message);} finally {file.value='';}
  };
  $('#clear').onclick=()=>{if(confirm('Clear your Codexa progress, drafts and project history?')){state=blank();persist();theme();render();notify('Codexa data cleared.');}};
}
function certificate(c) {
  const name=(prompt('Name to print on your certificate',state.legacy?.name||'')||'').trim().slice(0,80);
  if(!name) return;
  const cv=document.createElement('canvas');
  cv.width=1000;cv.height=620;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#071a1b';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#72f2d6';ctx.lineWidth=2;ctx.strokeRect(30,30,940,560);
  ctx.textAlign='center';
  for(const [text,y,size,color] of [['CODEXA / CERTIFICATE OF COMPLETION',132,23,'#72f2d6'],[name,253,56,'#f0fff9'],['completed the learning track',328,24,'#a9c9c2'],[c.title,414,44,'#72f2d6'],[c.lessons.length+' lessons · '+new Date().toLocaleDateString(),508,22,'#a9c9c2']]) {
    ctx.fillStyle=color;ctx.font=`600 ${size}px system-ui`;ctx.fillText(text,500,y,880);
  }
  const a=document.createElement('a');a.download='Codexa-'+c.id+'-certificate.png';a.href=cv.toDataURL('image/png');a.click();
}

let renderedPath='';
function render() {
  const path=location.hash.slice(1)||'home';
  if(path==='main') {app.focus();return;}
  const [route,id]=path.split('/');
  const item=Object.hasOwn(lessonMap,id)?lessonMap[id]:null;

  for(const link of $$('.nav a')) {
    if(link.hash==='#'+mainRoute) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  }
  if(route==='home') {
    app.innerHTML=landing();
    const demo=editor($('#demo-editor'),'const learner = "you";\nconst message = "Hello, " + learner + "!";\n\nconsole.log(message);','JavaScript preview editor');
    const run=$('#demo-run'),output=$('#demo-output');

  } else if(route==='start'||(route==='dashboard'&&startRoute()==='start')) {
    app.innerHTML=experiencePage();
    for(const choice of $$('[data-experience]')) choice.onclick=()=>{
      state.experience=choice.dataset.experience;
      persist();
      const first=courses[0].lessons.find(l=>!state.done.includes(l.id));
      location.hash=state.experience==='beginner'&&first?'lesson/'+first.id:'courses';
    };
  } else if(route==='dashboard') app.innerHTML=dashboard();
  else if(route==='courses') {
    app.innerHTML=courseExplorer();
    for(const field of $$('.filters input,.filters select')) field.addEventListener('input',updateCourses);
    updateCourses();
  } else if(route==='course'&&course) {
    app.innerHTML=coursePage(course);
    $('#certificate')?.addEventListener('click',()=>certificate(course));
  } else if((route==='lesson'||(route==='challenge'&&item&&runnable(item)))&&item) {
    const challenge=route==='challenge';
    if(!challenge) {
      if(!state.enrolled.includes(item.course.id)) state.enrolled.push(item.course.id);
      state.last=item.id;
      persist();
    }
    app.innerHTML=lessonPage(item,challenge);
    wireEditor(item,route);
    wirePanes();
    if(!challenge) {
      wireQuiz(item);
      wireGuide(item);
      updateCompletion(item);
      $('#complete-lesson').onclick=()=>{
        if(state.done.includes(item.id)) {notify('This lesson is already complete.');return;}
        if(completionRequirements(item).length) return;
        state.done.push(item.id);
        const next=[...item.course.lessons.slice(item.course.lessons.indexOf(item)+1),...courses.slice(courses.indexOf(item.course)+1).flatMap(c=>c.lessons)].find(l=>!state.done.includes(l.id));
        state.last=next?.id||lessons.find(l=>!state.done.includes(l.id))?.id||item.id;
        activity('Completed '+item.title);
        $('#complete-lesson').textContent='✓ Completed';
        $('#completion-note').textContent='Saved to your progress.';
        $('#next-lesson').outerHTML=nextLink(item);
        notify('Lesson complete');
      };
    }
  } else if(route==='practice') app.innerHTML=practice();
  else if(route==='assessment'&&assessment) {
    app.innerHTML=assessmentPage(assessment);
    wireQuiz({...assessment,title:lessonMap[assessment.lesson].title},'quiz/'+assessment.id,assessment.answer,assessment.reason);
  } else if(route==='projects') app.innerHTML=projectExplorer();
  else if(route==='project'&&project) {app.innerHTML=projectPage(project);wireEditor(project,'project');wirePanes();}
  else if(route==='progress') {app.innerHTML=progressPage();wireProgress();}
  else if(route==='sources') app.innerHTML=sourcesPage();
  else app.innerHTML=page('Page unavailable','This course, lesson, or project may have moved.',btn('Browse courses','courses',true));
  document.title=route==='home'?'Codexa — Learn to Code. Build Anything.':($('h1',app)?.textContent||'Learn')+' · Codexa';
  if(path!==renderedPath) {window.scrollTo(0,0);if(renderedPath) app.focus({preventScroll:true});renderedPath=path;}
}
window.addEventListener('hashchange',render);
$('.skip').addEventListener('click',event=>{event.preventDefault();app.focus();});
