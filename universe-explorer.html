<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌌 Universe Explorer — From one planet to everything.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eaefff; --dim:#8fa0c9; --accent:#4cc9f0; --heat:#ff7b1c;
  --glass:rgba(12,16,36,.72); --brd:rgba(120,170,255,.18); --brd-hi:rgba(76,201,240,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  user-select:none;-webkit-user-select:none}
h1,h2,h3,.fs{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.05em}
#gl{position:fixed;inset:0;z-index:0;touch-action:none}
#tint{position:fixed;inset:0;z-index:1;pointer-events:none;
  transition:background 1.2s;mix-blend-mode:screen;opacity:.55}
#fade{position:fixed;inset:0;z-index:8;background:#000;pointer-events:none;
  opacity:0;transition:opacity .3s}

/* ---- top bar ---- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:10px;
  align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,5,.8),transparent);pointer-events:none}
#brand{pointer-events:auto;font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:.78rem;letter-spacing:.1em;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 14px rgba(76,201,240,.6);cursor:pointer;padding:8px 0}
#crumbs{pointer-events:auto;flex:1;display:flex;align-items:center;gap:2px;
  overflow-x:auto;scrollbar-width:none;padding:4px 2px;min-width:0}
#crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;background:transparent;border:none;color:var(--dim);cursor:pointer;
  font-size:.74rem;padding:5px 7px;border-radius:8px;white-space:nowrap;
  font-family:'Orbitron',sans-serif;letter-spacing:.04em}
.crumb:hover{color:var(--accent);background:rgba(76,201,240,.1)}
.crumb.cur{color:var(--ink);text-shadow:0 0 10px rgba(76,201,240,.7)}
.crumb-sep{color:#3d4a70;font-size:.7rem;flex:none}

/* ---- search ---- */
#search-wrap{pointer-events:auto;position:relative;flex:none;width:min(220px,38vw)}
#search{width:100%;background:var(--glass);border:1px solid var(--brd);color:var(--ink);
  border-radius:99px;padding:9px 14px;font-size:.8rem;outline:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#search:focus{border-color:var(--brd-hi);box-shadow:0 0 14px rgba(76,201,240,.25)}
#search-list{position:absolute;top:calc(100% + 6px);right:0;width:min(260px,72vw);
  background:var(--glass);border:1px solid var(--brd);border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  overflow:hidden;display:none;max-height:280px;overflow-y:auto}
#search-list.open{display:block}
.s-item{padding:10px 14px;cursor:pointer;font-size:.82rem;display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.s-item:hover{background:rgba(76,201,240,.12)}
.s-item .ty{color:var(--dim);font-size:.66rem;white-space:nowrap}

/* ---- object labels in 3D ---- */
.lbl{position:fixed;z-index:3;transform:translate(-50%,-140%);cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.1em;color:#cfe2ff;
  text-shadow:0 0 8px rgba(0,0,20,.9),0 0 12px rgba(76,201,240,.35);
  padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:auto;
  transition:color .15s}
.lbl:hover{color:#fff;background:rgba(76,201,240,.14)}
.lbl .tick{display:block;width:1px;height:10px;background:rgba(140,190,255,.5);
  margin:2px auto 0}

/* ---- info panel ---- */
#panel{position:fixed;z-index:6;right:14px;top:calc(70px + env(safe-area-inset-top));
  width:min(330px,92vw);max-height:calc(100vh - 180px);display:flex;flex-direction:column;
  background:linear-gradient(165deg,rgba(16,22,50,.92),rgba(6,8,22,.94));
  border:1px solid var(--brd-hi);border-radius:18px;
  box-shadow:0 0 34px rgba(76,201,240,.16),0 18px 50px rgba(0,0,0,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .35s,opacity .35s}
#panel.hidden{transform:translateX(24px);opacity:0;pointer-events:none}
#panel .ph{padding:14px 16px 10px;border-bottom:1px dashed rgba(120,170,255,.28)}
#panel .ph h2{margin:0;font-size:.95rem}
#panel .ph .sub{color:var(--dim);font-size:.68rem;margin-top:4px;letter-spacing:.06em}
#panel .pb{padding:12px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.dsec{margin-bottom:14px}
.dsec h3{margin:0 0 6px;font-size:.66rem;letter-spacing:.16em;color:var(--accent)}
.dsec p{margin:0;font-size:.8rem;line-height:1.6;color:#d5ddf5}
.dsec ul{margin:0;padding-left:17px;font-size:.78rem;line-height:1.6;color:#d5ddf5}
.dsec li{margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:7px}
.links a{color:var(--accent);text-decoration:none;font-size:.72rem;font-weight:600;
  border:1px solid var(--brd-hi);border-radius:99px;padding:5px 11px;
  background:rgba(76,201,240,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--brd);color:#cfe2ff;
  border-radius:99px;padding:5px 11px;font-size:.7rem;cursor:pointer}
.chip:hover{border-color:var(--brd-hi);color:#fff}
#panel .pf{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--brd)}
.btn{flex:1;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;
  letter-spacing:.06em;background:rgba(76,201,240,.14);border:1px solid var(--brd-hi);
  color:var(--ink);padding:10px 8px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;border-color:var(--brd)}
#panel-toggle{position:fixed;z-index:6;right:14px;top:calc(70px + env(safe-area-inset-top));
  background:var(--glass);border:1px solid var(--brd);color:var(--ink);border-radius:12px;
  padding:9px 12px;cursor:pointer;font-size:.9rem;display:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#panel-toggle.show{display:block}

/* ---- hint + toast ---- */
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;
  transform:translateX(-50%);color:var(--dim);font-size:.68rem;letter-spacing:.08em;
  background:rgba(0,0,8,.55);padding:7px 15px;border-radius:99px;pointer-events:none;
  transition:opacity .6s;text-align:center;max-width:92vw}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(16px);
  z-index:9;background:var(--glass);border:1px solid var(--brd-hi);color:var(--ink);
  padding:10px 18px;border-radius:99px;font-size:.8rem;font-weight:600;opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  #panel{right:0;left:0;top:auto;bottom:0;width:100%;max-height:52vh;
    border-radius:20px 20px 0 0;border-left:none;border-right:none;border-bottom:none}
  #panel.hidden{transform:translateY(30px)}
  #hint{bottom:auto;top:calc(64px + env(safe-area-inset-top))}
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tint"></div>
<div id="fade"></div>

<div id="topbar">
  <div id="brand" title="Back to the Universe">🌌 UE</div>
  <div id="crumbs"></div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search the universe…" autocomplete="off">
    <div id="search-list"></div>
  </div>
</div>

<button id="panel-toggle">ℹ️</button>
<div id="panel" class="hidden">
  <div class="ph"><h2 id="p-name">EARTH</h2><div class="sub" id="p-sub">Planet · Sol System</div></div>
  <div class="pb" id="p-body"></div>
  <div class="pf">
    <button class="btn" id="p-copy">📋 COPY INFO</button>
    <button class="btn ghost" id="p-hide">HIDE</button>
  </div>
</div>

<div id="hint">CLICK AN OBJECT TO FLY IN · DRAG TO LOOK · SCROLL / PINCH TO ZOOM</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================================================================
   1. DATA — the whole universe, one schema at every scale
   kind: void | supercluster | cluster | spiral | irregular | elliptical
         | system | star | planet | moon
   ================================================================ */
const DATA = [
{ id:"universe", parentId:null, scaleLevel:0, name:"Observable Universe", type:"Everything we can see",
  visual:{kind:"void", r:6, color:"#7b5cff"},
  dossier:{
    nameOrigin:"'Universe' comes from Latin 'universum' — literally 'all things turned into one'. The observable universe is the sphere of everything whose light has had time to reach us.",
    quickFacts:[
      "Diameter: about 93 billion light-years",
      "Age: roughly 13.8 billion years since the Big Bang",
      "Contains an estimated hundreds of billions to ~2 trillion galaxies",
      "Galaxies are arranged in a vast 'cosmic web' of filaments and voids"
    ],
    knownSince:"Concept of an expanding universe: 1920s (Hubble, Lemaître)",
    learnMore:[
      {label:"NASA Universe",url:"https://science.nasa.gov/universe/"},
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Observable_universe"}
    ]}},

/* ---------- LEVEL 1 · SUPERCLUSTERS ---------- */
{ id:"laniakea", parentId:"universe", scaleLevel:1, name:"Laniakea", type:"Supercluster",
  visual:{kind:"supercluster", r:6, color:"#8f7bff"},
  dossier:{
    nameOrigin:"Hawaiian for 'immense heaven' — named in 2014 to honor the Polynesian navigators who crossed the Pacific using the stars.",
    quickFacts:[
      "Our home supercluster — it contains the Milky Way",
      "About 520 million light-years across",
      "Holds roughly 100,000 galaxies",
      "Its galaxies all drift toward a mysterious region called the Great Attractor"
    ],
    knownSince:"Defined and named in 2014 (R. Brent Tully and team)",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Laniakea_Supercluster"}
    ]}},
{ id:"perseus-pisces", parentId:"universe", scaleLevel:1, name:"Perseus–Pisces", type:"Supercluster",
  visual:{kind:"supercluster", r:6, color:"#6f8cff"},
  dossier:{
    nameOrigin:"Named after the two constellations, Perseus and Pisces, that it stretches across in our sky.",
    quickFacts:[
      "One of the largest known structures in the universe",
      "A dense filament of galaxies roughly 250 million light-years long",
      "One of Laniakea's great neighboring superclusters",
      "Clearly visible as a 'wall' in 3D maps of the galaxy distribution"
    ],
    knownSince:"Mapped in detail in the 1980s",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Perseus%E2%80%93Pisces_Supercluster"}
    ]}},
{ id:"virgo-sc", parentId:"universe", scaleLevel:1, name:"Virgo Supercluster", type:"Supercluster",
  visual:{kind:"supercluster", r:6, color:"#9a6fff"},
  dossier:{
    nameOrigin:"Named for the constellation Virgo — Latin for 'maiden' — where its central cluster appears in our sky. Also called the Local Supercluster.",
    quickFacts:[
      "About 110 million light-years in diameter",
      "Contains our Local Group of galaxies",
      "Centered on the massive Virgo galaxy cluster",
      "Now understood to be one lobe of the larger Laniakea complex"
    ],
    knownSince:"Proposed in the 1950s (Gérard de Vaucouleurs)",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Virgo_Supercluster"}
    ]}},
{ id:"coma-sc", parentId:"universe", scaleLevel:1, name:"Coma", type:"Supercluster",
  visual:{kind:"supercluster", r:6, color:"#5f7bff"},
  dossier:{
    nameOrigin:"Named after the constellation Coma Berenices — 'Berenice's Hair' — the only constellation named after a real historical person: Queen Berenice II of Egypt, who sacrificed her hair as an offering.",
    quickFacts:[
      "Contains the great Coma and Leo galaxy clusters",
      "Spans on the order of 100 million light-years",
      "Sits hundreds of millions of light-years from the Milky Way",
      "Studies of the Coma Cluster in 1933 gave the first evidence for dark matter (Fritz Zwicky)"
    ],
    knownSince:"Coma Cluster cataloged in the 19th century; supercluster mapped in the 20th",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Coma_Supercluster"}
    ]}},
{ id:"shapley", parentId:"universe", scaleLevel:1, name:"Shapley", type:"Supercluster",
  visual:{kind:"supercluster", r:6, color:"#b06fff"},
  dossier:{
    nameOrigin:"Named after astronomer Harlow Shapley, who first noticed this remarkable concentration of galaxies in the 1930s.",
    quickFacts:[
      "The densest concentration of galaxies in our nearby universe",
      "Roughly 650 million light-years away",
      "Its enormous gravity pulls on our entire region of space",
      "Contains dozens of rich galaxy clusters"
    ],
    knownSince:"Noted 1930s; recognized as a supercluster in 1989",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Shapley_Supercluster"}
    ]}},

/* ---------- LEVEL 2 · GALAXY CLUSTERS ---------- */
{ id:"local-group", parentId:"laniakea", scaleLevel:2, name:"Local Group", type:"Galaxy Cluster",
  visual:{kind:"cluster", r:6, color:"#6fa8ff"},
  dossier:{
    nameOrigin:"A refreshingly plain name — Edwin Hubble simply called it 'the local group' of galaxies in 1936, and it stuck.",
    quickFacts:[
      "Our home cluster: 80+ known member galaxies",
      "About 10 million light-years across",
      "Dominated by two giants: the Milky Way and Andromeda",
      "Those two giants will merge in roughly 4–5 billion years"
    ],
    knownSince:"Named in 1936 (Edwin Hubble)",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Local_Group"}
    ]}},
{ id:"virgo-cluster", parentId:"laniakea", scaleLevel:2, name:"Virgo Cluster", type:"Galaxy Cluster",
  visual:{kind:"cluster", r:6, color:"#8f9bff"},
  dossier:{
    nameOrigin:"Named for the constellation Virgo ('maiden') in which it appears from Earth.",
    quickFacts:[
      "Contains roughly 1,000–2,000 galaxies",
      "About 54 million light-years away",
      "The massive heart of our local supercluster",
      "Its gravity slowly pulls the Local Group toward it"
    ],
    knownSince:"Its bright members cataloged by Messier in the 1780s",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Virgo_Cluster"}
    ]}},

/* ---------- LEVEL 3 · GALAXIES ---------- */
{ id:"milky-way", parentId:"local-group", scaleLevel:3, name:"Milky Way", type:"Barred Spiral Galaxy",
  visual:{kind:"spiral", r:10, color:"#bcd2ff"},
  dossier:{
    nameOrigin:"From Latin 'Via Lactea', itself from Greek 'galaxias kyklos' — 'milky circle', for its milky band across the night sky. The very word 'galaxy' comes from the Greek for milk.",
    quickFacts:[
      "Our home galaxy: a barred spiral ~100,000 light-years across",
      "Contains 100–400 billion stars",
      "A supermassive black hole, Sagittarius A*, sits at its center",
      "The Sun lies ~26,000 light-years from the center, in the Orion Arm"
    ],
    knownSince:"Known since antiquity; understood as our galaxy in the 1920s",
    learnMore:[
      {label:"NASA",url:"https://science.nasa.gov/universe/galaxies/"},
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Milky_Way"}
    ]}},
{ id:"andromeda", parentId:"local-group", scaleLevel:3, name:"Andromeda (M31)", type:"Spiral Galaxy",
  visual:{kind:"spiral", r:10, color:"#cfd8ff"},
  dossier:{
    nameOrigin:"Named after the princess Andromeda of Greek mythology, whose constellation it appears in — she was chained to a rock as a sacrifice and rescued by Perseus.",
    quickFacts:[
      "The nearest large galaxy: about 2.5 million light-years away",
      "Holds on the order of one trillion stars",
      "The most distant object easily visible to the naked eye",
      "On a slow collision course with the Milky Way (~4.5 billion years)"
    ],
    knownSince:"Recorded by Persian astronomer al-Sufi in 964 CE",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Andromeda_Galaxy"}
    ]}},
{ id:"triangulum", parentId:"local-group", scaleLevel:3, name:"Triangulum (M33)", type:"Spiral Galaxy",
  visual:{kind:"spiral", r:9, color:"#b9e2ff"},
  dossier:{
    nameOrigin:"Named for the small triangle-shaped constellation Triangulum ('the triangle' in Latin) where it sits in our sky.",
    quickFacts:[
      "The third-largest galaxy in the Local Group",
      "About 2.7 million light-years away",
      "Contains roughly 40 billion stars",
      "May be a distant, gravitationally-bound companion of Andromeda"
    ],
    knownSince:"Cataloged by Charles Messier in 1764",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Triangulum_Galaxy"}
    ]}},
{ id:"lmc", parentId:"local-group", scaleLevel:3, name:"Large Magellanic Cloud", type:"Dwarf Galaxy",
  visual:{kind:"irregular", r:7, color:"#ffd9b8"},
  dossier:{
    nameOrigin:"Named after explorer Ferdinand Magellan — his crew documented these glowing 'clouds' during the first circumnavigation of Earth (1519–1522).",
    quickFacts:[
      "A satellite galaxy of the Milky Way, ~160,000 light-years away",
      "Easily visible to the naked eye from the Southern Hemisphere",
      "Hosted Supernova 1987A — the closest observed supernova in centuries",
      "Contains the Tarantula Nebula, a huge star-forming region"
    ],
    knownSince:"Known to southern sky-watchers for millennia; documented in 1519",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Large_Magellanic_Cloud"}
    ]}},
{ id:"smc", parentId:"local-group", scaleLevel:3, name:"Small Magellanic Cloud", type:"Dwarf Galaxy",
  visual:{kind:"irregular", r:6, color:"#ffe6cf"},
  dossier:{
    nameOrigin:"The smaller of the two 'clouds' named after Ferdinand Magellan, whose expedition brought word of them to Europe.",
    quickFacts:[
      "A dwarf irregular galaxy about 200,000 light-years away",
      "Contains several hundred million stars",
      "Visible to the naked eye from the Southern Hemisphere",
      "Connected to the LMC by a bridge of gas and stars"
    ],
    knownSince:"Known to southern sky-watchers for millennia; documented in 1519",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Small_Magellanic_Cloud"}
    ]}},
{ id:"m87", parentId:"virgo-cluster", scaleLevel:3, name:"Messier 87", type:"Giant Elliptical Galaxy",
  visual:{kind:"elliptical", r:9, color:"#ffe9c9"},
  dossier:{
    nameOrigin:"'M' stands for the catalog of French astronomer Charles Messier — this was entry number 87 in his 1781 list of fuzzy objects that were NOT comets.",
    quickFacts:[
      "A giant elliptical galaxy near the heart of the Virgo Cluster",
      "Its 6.5-billion-solar-mass black hole starred in the first-ever photo of a black hole (2019)",
      "Shoots a jet of plasma ~5,000 light-years long",
      "Surrounded by an enormous swarm of ~15,000 globular clusters"
    ],
    knownSince:"Cataloged in 1781",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Messier_87"}
    ]}},
{ id:"sombrero", parentId:"virgo-cluster", scaleLevel:3, name:"Sombrero Galaxy", type:"Spiral Galaxy",
  visual:{kind:"spiral", r:8, color:"#ffe0b0"},
  dossier:{
    nameOrigin:"Nicknamed for its uncanny resemblance to a Mexican sombrero hat — a bright glowing bulge wrapped in a dark brim of dust.",
    quickFacts:[
      "About 31 million light-years away, on the southern edge of the Virgo cluster region",
      "Seen almost perfectly edge-on from Earth",
      "Total mass around 800 billion Suns",
      "Officially cataloged as Messier 104"
    ],
    knownSince:"Discovered in 1781 (Pierre Méchain)",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Sombrero_Galaxy"}
    ]}},

/* ---------- LEVEL 4 · STAR SYSTEMS (in the Milky Way) ---------- */
{ id:"sol", parentId:"milky-way", scaleLevel:4, name:"Sol System", type:"Star System · G-type",
  visual:{kind:"system", r:7, color:"#ffd166"},
  dossier:{
    nameOrigin:"'Sol' is simply Latin for 'Sun' — it gives us the word 'solar'. Our star's English name comes from Old English 'sunne'.",
    quickFacts:[
      "Home. Our star plus 8 planets, 5 dwarf planets and countless small bodies",
      "The Sun holds 99.86% of the entire system's mass",
      "About 4.6 billion years old",
      "Located in the Orion Arm, ~26,000 light-years from the galactic center"
    ],
    knownSince:"Known since forever — we live here",
    learnMore:[
      {label:"NASA Solar System",url:"https://science.nasa.gov/solar-system/"},
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Solar_System"}
    ]}},
{ id:"alpha-centauri", parentId:"milky-way", scaleLevel:4, name:"Alpha Centauri", type:"Triple Star System",
  visual:{kind:"system", r:6, color:"#ffe9a8"},
  dossier:{
    nameOrigin:"'Alpha' marks it as the brightest star of the constellation Centaurus — the centaur of Greek myth. Its faint third star is 'Proxima', Latin for 'nearest'.",
    quickFacts:[
      "The closest star system to the Sun: 4.37 light-years",
      "A triple system: sun-like stars A and B, plus the red dwarf Proxima",
      "Proxima Centauri is the single nearest star to us (4.24 ly)",
      "Hosts Proxima b, the closest known exoplanet"
    ],
    knownSince:"Star known since antiquity; distance measured in 1839",
    learnMore:[
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/Alpha_Centauri"}
    ]}},
{ id:"trappist-1", parentId:"milky-way", scaleLevel:4, name:"TRAPPIST-1", type:"Red Dwarf System",
  visual:{kind:"system", r:5, color:"#ff9d7a"},
  dossier:{
    nameOrigin:"Named after the TRAPPIST telescope in Chile that discovered its planets — an acronym that playfully honors Belgian Trappist monks (and their famous beer).",
    quickFacts:[
      "An ultracool red dwarf about 40 light-years away",
      "Hosts SEVEN Earth-sized rocky planets — a record",
      "Several of its planets orbit in the habitable zone",
      "A prime target of the James Webb Space Telescope"
    ],
    knownSince:"Planetary system revealed 2016–2017",
    learnMore:[
      {label:"NASA",url:"https://science.nasa.gov/exoplanet-catalog/trappist-1/"},
      {label:"Wikipedia",url:"https://en.wikipedia.org/wiki/TRAPPIST-1"}
    ]}},
{ id:"kepler-452", parentId:"milky-way", scaleLevel:4, name:"Kepler-452", type:"Sun-like Star System",
  visual:{kind:"system", r:5, color:"#fff0b8"},
  dossier:{
    nameOrigin:"Named for NASA's Kepler space telescope that found it — itself named after Johannes Kepler, who worked out the laws of planetary motion in the 1600s.",
    quickFacts:[
      "A sun-like star roughly 1,800 light-years away",
      "Slightly older and brighter than our Sun",
      "Famous for hosting Kepler-452b, 'Earth's cousin'",
      "Discovered among 150,000+ stars Kepler stared at for years"
    ],
    knownSince:"Planet announced in 2015",
    learnMore:[

/* ---- lookups ---- */
const BY_ID={}, CHILDREN={};
DATA.forEach(o=>{ BY_ID[o.id]=o; });
DATA.forEach(o=>{ if(o.parentId){ (CHILDREN[o.parentId]=CHILDREN[o.parentId]||[]).push(o); } });
function childrenOf(id){ return CHILDREN[id]||[]; }
function pathOf(id){ const p=[]; let o=BY_ID[id]; while(o){ p.unshift(o.id); o=o.parentId?BY_ID[o.parentId]:null; } return p; }

  for(let i=0;i<n;i++){
    const r=480+Math.random()*520, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p); pos[i*3+2]=r*Math.sin(p)*Math.sin(t);

/* ---- shared textures ---- */
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
const glowTex=(function(){
  const c=mkCanvas(128,128),x=c.getContext("2d");
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(0.35,"rgba(255,255,255,0.45)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
const spiralTex=(function(){
  const c=mkCanvas(256,256),x=c.getContext("2d");
  x.translate(128,128);
  const g=x.createRadialGradient(0,0,0,0,0,40);
  g.addColorStop(0,"rgba(255,255,255,0.95)"); g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g; x.beginPath(); x.arc(0,0,40,0,7); x.fill();
  for(let arm=0;arm<3;arm++){
    for(let i=0;i<220;i++){
      const t=i/220, ang=arm*(Math.PI*2/3)+t*4.6+(Math.random()-0.5)*0.35;
      const rr=8+t*112+(Math.random()-0.5)*10;
      x.fillStyle="rgba(255,255,255,"+(0.5*(1-t)+0.08)+")";
      x.beginPath(); x.arc(Math.cos(ang)*rr,Math.sin(ang)*rr,1.4+Math.random()*1.6,0,7); x.fill();
    }
  }
  return new THREE.CanvasTexture(c);
})();
const texCache={};
function planetTexture(v){
  const key=v.colors.join()+(v.bands?"b":"");
  if(texCache[key]) return texCache[key];
  const c=mkCanvas(128,64),x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,64);
  g.addColorStop(0,v.colors[0]); g.addColorStop(1,v.colors[1]);
  x.fillStyle=g; x.fillRect(0,0,128,64);
  if(v.bands){
    for(let i=0;i<9;i++){
      x.globalAlpha=0.16+Math.random()*0.3;
      x.fillStyle=v.colors[Math.random()<0.5?1:2];
      const y=Math.random()*60; x.fillRect(0,y,128,2+Math.random()*6);
    }
  } else {
    for(let i=0;i<26;i++){
      x.globalAlpha=0.14+Math.random()*0.3;
      x.fillStyle=v.colors[Math.random()<0.6?1:2];
      x.beginPath();
      x.ellipse(Math.random()*128,Math.random()*64,4+Math.random()*14,3+Math.random()*8,0,0,7);
      x.fill();
    }
  }
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); texCache[key]=t; return t;
}
function sprite(tex,color,scale){
  const m=new THREE.SpriteMaterial({map:tex,color:color,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const s=new THREE.Sprite(m); s.scale.set(scale,scale,1); return s;
}
function seeded(id){ let h=2166136261;
  for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}
  return function(){ h|=0; h=(h+0x6D2B79F5)|0; let t=Math.imul(h^(h>>>15),1|h);
    t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}

/* ---- cloud helpers (superclusters / galaxies) ---- */
function pointCloud(n,posFn,colorA,colorB,size){
  const pos=new Float32Array(n*3), col=new Float32Array(n*3);
  const cA=new THREE.Color(colorA), cB=new THREE.Color(colorB), tmp=new THREE.Color();
  for(let i=0;i<n;i++){
    const p=posFn(i,n); pos[i*3]=p[0]; pos[i*3+1]=p[1]; pos[i*3+2]=p[2];
    tmp.copy(cA).lerp(cB,p[3]!==undefined?p[3]:Math.random());
    col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:size,vertexColors:true,transparent:true,
    opacity:0.9,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  return new THREE.Points(g,m);
}
function gauss(rnd){ return (rnd()+rnd()+rnd()-1.5)/1.5; }

/* ---- build the CENTER visual for the focused object ---- */
const spinners=[];
function buildFocusVisual(o,group){
  const v=o.visual, rnd=seeded(o.id);
  if(v.kind==="void"){
    const glow=sprite(glowTex,v.color,30); glow.material.opacity=0.12; group.add(glow);
  }
  else if(v.kind==="supercluster"||v.kind==="cluster"){
    const clumps=[]; const nc=v.kind==="supercluster"?5:3;
    for(let i=0;i<nc;i++) clumps.push([gauss(rnd)*7,gauss(rnd)*4,gauss(rnd)*7]);
    const cloud=pointCloud(isMobile?380:640,function(){
      const c=clumps[Math.floor(rnd()*clumps.length)];
      return [c[0]+gauss(rnd)*3.4, c[1]+gauss(rnd)*2.4, c[2]+gauss(rnd)*3.4, rnd()];
    },v.color,"#ffffff",0.5);
    group.add(cloud); spinners.push({obj:cloud,spd:0.02});
    const glow=sprite(glowTex,v.color,26); glow.material.opacity=0.28; group.add(glow);
  }
  else if(v.kind==="spiral"){
    const cloud=pointCloud(isMobile?900:1700,function(i,n){
      const arm=i%3, t=Math.pow(rnd(),0.65);
      const ang=arm*(Math.PI*2/3)+t*4.4+(rnd()-0.5)*0.45;
      const rr=1.6+t*13;
      return [Math.cos(ang)*rr,(rnd()-0.5)*(1.6-t*1.2),Math.sin(ang)*rr,t];
    },"#ffe2b8",v.color,0.34);
    cloud.rotation.x=0.5; group.add(cloud); spinners.push({obj:cloud,spd:0.05});
    const glow=sprite(glowTex,"#fff0d8",10); glow.material.opacity=0.55; group.add(glow);
  }
  else if(v.kind==="irregular"){
    const cloud=pointCloud(isMobile?450:800,function(){
      return [gauss(rnd)*7.5,gauss(rnd)*3.6,gauss(rnd)*5.5,rnd()];
    },"#fff0d8",v.color,0.4);
    group.add(cloud); spinners.push({obj:cloud,spd:0.03});
  }
  else if(v.kind==="elliptical"){
    const cloud=pointCloud(isMobile?550:950,function(){
      return [gauss(rnd)*6,gauss(rnd)*4.6,gauss(rnd)*6,rnd()];
    },"#fff4dd",v.color,0.36);
    group.add(cloud);
    const glow=sprite(glowTex,v.color,16); glow.material.opacity=0.5; group.add(glow);
  }
  else if(v.kind==="system"){
    const star=new THREE.Mesh(new THREE.SphereGeometry(3.1,28,20),
      new THREE.MeshBasicMaterial({color:v.color}));
    group.add(star);
    const glow=sprite(glowTex,v.color,17); glow.material.opacity=0.8; group.add(glow);
    const glow2=sprite(glowTex,"#ffffff",7); glow2.material.opacity=0.9; group.add(glow2);
  }
  else if(v.kind==="planet"){
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(5,36,26),
      new THREE.MeshLambertMaterial({map:planetTexture(v)}));
    group.add(mesh); spinners.push({obj:mesh,spd:0.12});
    if(v.ring){
      const ring=new THREE.Mesh(new THREE.RingGeometry(6.8,10.6,52),
        new THREE.MeshBasicMaterial({color:0xd8c592,side:THREE.DoubleSide,transparent:true,opacity:0.5}));
      ring.rotation.x=1.32; group.add(ring);
    }
  }
}

/* ---- build a CHILD marker ---- */
function buildChildVisual(o){
  const v=o.visual, g=new THREE.Group();
  if(v.kind==="supercluster"||v.kind==="cluster"){
    const s=sprite(glowTex,v.color,v.kind==="supercluster"?8:7); s.material.opacity=0.85; g.add(s);
    const core=sprite(glowTex,"#ffffff",2.6); g.add(core);
  }
  else if(v.kind==="spiral"){
    const s=sprite(spiralTex,v.color,8); s.material.rotation=seeded(o.id)()*6.28; g.add(s);
  }
  else if(v.kind==="irregular"||v.kind==="elliptical"){
    const s=sprite(glowTex,v.color,v.r*0.8); s.material.opacity=0.9; g.add(s);
  }
  else if(v.kind==="system"){
    const s=sprite(glowTex,v.color,4.6); g.add(s);
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.55,14,10),
      new THREE.MeshBasicMaterial({color:v.color})));
  }
  else if(v.kind==="planet"){
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(v.r,26,18),
      new THREE.MeshLambertMaterial({map:planetTexture(v)}));
    g.add(mesh); spinners.push({obj:mesh,spd:0.2});
    if(v.ring){
      const ring=new THREE.Mesh(new THREE.RingGeometry(v.r*1.4,v.r*2.1,40),
        new THREE.MeshBasicMaterial({color:0xd8c592,side:THREE.DoubleSide,transparent:true,opacity:0.5}));
      ring.rotation.x=1.32; g.add(ring);
    }
  }
  return g;
}

/* ================================================================
   3. SCENE STATE, CAMERA, TRANSITIONS, ROUTING, UI
   ================================================================ */
const world=new THREE.Group(); scene.add(world);
let focusId=null, childEntries=[], defaultDist=60;
let cam={theta:0.9, phi:1.2, dist:60, target:new THREE.Vector3()};
let anim=null, navCooldown=0, lastInteract=performance.now();
let labelsHidden=false, navLock=false;
const TINTS=["#3b1a6e","#2a2a7e","#1a3a7e","#145a7e","#7e5a14","#7e3a14","#7e1440"];

function childPos(o,i,n){
  const rnd=seeded(o.id);
  if(o.orbit!==undefined){
    const r=10+o.orbit*4.3, a=o.orbit*2.05+rnd()*1.4;
    return new THREE.Vector3(Math.cos(a)*r,(rnd()-0.5)*1.4,Math.sin(a)*r);
  }
  const r=21+(i%3)*7+rnd()*5, a=i*2.39996+rnd()*0.7;
  const y=((i/Math.max(1,n-1))-0.5)*15+(rnd()-0.5)*4;
  return new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r);
}
function orbitRing(r){
  const pts=[];
  for(let i=0;i<72;i++){ const a=i/72*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r)); }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:0x4cc9f0,transparent:true,opacity:0.13}));
}
function clearWorld(){
  spinners.length=0;
  while(world.children.length){ world.remove(world.children[world.children.length-1]); }
  childEntries.forEach(e=>e.label.remove()); childEntries=[];
}
function hideLabels(b){
  labelsHidden=b;
  childEntries.forEach(e=>e.label.style.display=b?"none":"block");
}
function swapFocus(id){
  clearWorld(); focusId=id; labelsHidden=false;
  const o=BY_ID[id];
  const fg=new THREE.Group(); buildFocusVisual(o,fg); world.add(fg);
  const kids=childrenOf(id); let maxR=14;
  kids.forEach((k,i)=>{
    const pos=childPos(k,i,kids.length);
    maxR=Math.max(maxR,pos.length()+(k.visual.r||2));
    if(k.orbit!==undefined) world.add(orbitRing(Math.hypot(pos.x,pos.z)));
    const g=buildChildVisual(k); g.position.copy(pos); g.userData.oid=k.id; world.add(g);
    const lbl=document.createElement("div"); lbl.className="lbl";
    lbl.innerHTML=k.name.toUpperCase()+'<span class="tick"></span>';
    lbl.addEventListener("click",ev=>{ ev.stopPropagation(); flyTo(k.id); });
    document.body.appendChild(lbl);
    childEntries.push({id:k.id,pos,label:lbl});
  });
  defaultDist=Math.max(30,Math.min(85,maxR*1.75+16));
  updateCrumbs(); renderPanel(o); setHash(id);
  document.getElementById("tint").style.background=
    "radial-gradient(circle at 50% 62%, rgba(0,0,0,0) 42%, "+TINTS[Math.min(6,o.scaleLevel)]+"66 132%)";
}
function easeIO(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function easeO(t){ return 1-Math.pow(1-t,3); }
function flyTo(id){
  if(anim) return;
  const entry=childEntries.find(e=>e.id===id);
  if(!entry){ jumpTo(id); return; }
  hideLabels(true);
  anim={mode:"in",t:0,dur:1.15,fromT:cam.target.clone(),toT:entry.pos.clone(),
        fromD:cam.dist,toD:5.5,next:id};
  navCooldown=performance.now()+1700;
}
function jumpTo(id){
  if(!BY_ID[id]) return;
  navCooldown=performance.now()+1700;
  const f=document.getElementById("fade"); f.style.opacity=1;
  setTimeout(()=>{
    swapFocus(id);
    cam.target.set(0,0,0); cam.dist=defaultDist*1.35;
    anim={mode:"settle",t:0,dur:0.8,fromD:cam.dist,toD:defaultDist};
    f.style.opacity=0;
  },320);
}

/* ---- camera + input ---- */
function applyCamera(){
  const sp=Math.sin(cam.phi);
  camera.position.set(
    cam.target.x+cam.dist*sp*Math.cos(cam.theta),
    cam.target.y+cam.dist*Math.cos(cam.phi),
    cam.target.z+cam.dist*sp*Math.sin(cam.theta));
  camera.lookAt(cam.target);
}
const ray=new THREE.Raycaster();
function pickAt(x,y){
  const v=new THREE.Vector2(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);
  ray.setFromCamera(v,camera);
  const hits=ray.intersectObjects(world.children,true);
  for(const h of hits){ let o=h.object;
    while(o&&!o.userData.oid) o=o.parent;
    if(o&&o.userData.oid) return o.userData.oid; }
  return null;
}
function zoomBy(f){
  if(anim) return;
  lastInteract=performance.now();
  const nd=cam.dist*f;
  const minD=defaultDist*0.3, maxD=defaultDist*2.6;
  if(nd<minD && performance.now()>navCooldown){
    // auto-dive into the child nearest to screen center
    let best=null,bd=1e9; const v=new THREE.Vector3();
    for(const e of childEntries){
      v.copy(e.pos).project(camera);
      if(v.z>1) continue;
      const sx=(v.x*0.5+0.5)*window.innerWidth, sy=(-v.y*0.5+0.5)*window.innerHeight;
      const d=Math.hypot(sx-window.innerWidth/2,sy-window.innerHeight/2);
      if(d<bd){bd=d;best=e;}
    }
    if(best&&bd<160){ flyTo(best.id); return; }
  }
  if(nd>maxD*1.03 && performance.now()>navCooldown){
    const parent=BY_ID[focusId].parentId;
    if(parent){ jumpTo(parent); return; }
  }
  cam.dist=Math.max(minD,Math.min(maxD,nd));
}
const pointers=new Map(); let pinchD=0, downPt=null, moved=false;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  downPt={x:e.clientX,y:e.clientY}; moved=false;
  lastInteract=performance.now();
  if(pointers.size===2){
    const a=[...pointers.values()];
    pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId);
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Math.hypot(e.clientX-(downPt?downPt.x:0),e.clientY-(downPt?downPt.y:0))>7) moved=true;
  lastInteract=performance.now();
  if(pointers.size===1&&!anim){
    cam.theta+=dx*0.0052;
    cam.phi=Math.max(0.25,Math.min(2.85,cam.phi+dy*0.0052));
  } else if(pointers.size===2){
    const a=[...pointers.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0&&d>0) zoomBy(pinchD/d);
    pinchD=d;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId); pinchD=0;
  if(!moved&&downPt&&!anim&&pointers.size===0){
    const id=pickAt(downPt.x,downPt.y);
    if(id) flyTo(id);
  }
  if(pointers.size===0) downPt=null;
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(Math.exp(e.deltaY*0.0011)); },{passive:false});

/* ---- breadcrumbs ---- */
function updateCrumbs(){
  const wrap=document.getElementById("crumbs"); wrap.innerHTML="";
  const path=pathOf(focusId);
  path.forEach((id,i)=>{
    if(i>0){ const s=document.createElement("span"); s.className="crumb-sep"; s.textContent="›"; wrap.appendChild(s); }
    const b=document.createElement("button");
    b.className="crumb"+(i===path.length-1?" cur":"");
    b.textContent=(id==="universe"?"Universe":BY_ID[id].name);
    if(i<path.length-1) b.addEventListener("click",()=>jumpTo(id));
    wrap.appendChild(b);
  });
  wrap.scrollLeft=wrap.scrollWidth;
}

/* ---- info panel ---- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const panel=document.getElementById("panel"), pToggle=document.getElementById("panel-toggle");
function renderPanel(o){
  const d=o.dossier;
  document.getElementById("p-name").textContent=o.name.toUpperCase();
  document.getElementById("p-sub").textContent=o.type+(o.parentId?" · "+BY_ID[o.parentId].name:"");
  let h="";
  h+='<div class="dsec"><h3>📛 WHY THE NAME?</h3><p>'+esc(d.nameOrigin)+'</p></div>';
  h+='<div class="dsec"><h3>📊 KEY FACTS</h3><ul>'+d.quickFacts.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul></div>';
  if(d.knownSince) h+='<div class="dsec"><h3>🕰 KNOWN SINCE</h3><p>'+esc(d.knownSince)+'</p></div>';
  h+='<div class="dsec"><h3>🔗 LEARN MORE</h3><div class="links">'+
     d.learnMore.map(l=>'<a href="'+l.url+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join("")+'</div></div>';
  const kids=childrenOf(o.id);
  if(kids.length) h+='<div class="dsec"><h3>🔍 ZOOM IN</h3><div class="chips">'+
     kids.map(k=>'<span class="chip" data-go="'+k.id+'">'+esc(k.name)+'</span>').join("")+'</div></div>';
  const pb=document.getElementById("p-body");
  pb.innerHTML=h; pb.scrollTop=0;
  pb.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>flyTo(c.dataset.go)));
  panel.classList.remove("hidden"); pToggle.classList.remove("show");
}
document.getElementById("p-hide").addEventListener("click",()=>{
  panel.classList.add("hidden"); pToggle.classList.add("show");
});
pToggle.addEventListener("click",()=>{
  panel.classList.remove("hidden"); pToggle.classList.remove("show");
});

/* ---- copy info ---- */
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2300);
}
function shareText(o){
  const d=o.dossier;
  return "🌌 "+o.name.toUpperCase()+" — Cosmic Dossier (via Universe Explorer)\n\n"+
    "Why the name? "+d.nameOrigin+"\n\nKey Facts:\n"+
    d.quickFacts.map(f=>"- "+f).join("\n")+
    (d.knownSince?"\n\nKnown since: "+d.knownSince:"")+
    "\n\nLearn more: "+d.learnMore[0].url;
}
document.getElementById("p-copy").addEventListener("click",()=>{
  const o=BY_ID[focusId]; if(!o) return;
  const txt=shareText(o);
  const ok=()=>showToast("Copied! Paste it anywhere 🚀");
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  else fallbackCopy(txt,ok);
});
function fallbackCopy(txt,ok){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ showToast("Copy failed"); }
  document.body.removeChild(ta);
}

/* ---- search ---- */
const sInput=document.getElementById("search"), sList=document.getElementById("search-list");
sInput.addEventListener("input",()=>{
  const q=sInput.value.trim().toLowerCase();
  if(!q){ sList.classList.remove("open"); return; }
  const m=DATA.filter(o=>o.name.toLowerCase().includes(q)).slice(0,8);
  if(!m.length){ sList.classList.remove("open"); return; }
  sList.innerHTML=m.map(o=>'<div class="s-item" data-go="'+o.id+'"><span>'+esc(o.name)+
    '</span><span class="ty">'+esc(o.type)+'</span></div>').join("");
  sList.querySelectorAll(".s-item").forEach(it=>{
    it.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      const id=it.dataset.go;
      sList.classList.remove("open"); sInput.value=""; sInput.blur();
      if(id===focusId){ showToast("You're already here 🙂"); return; }
      showToast("→ "+BY_ID[id].name);
      jumpTo(id);
    });
  });
  sList.classList.add("open");
});
sInput.addEventListener("blur",()=>setTimeout(()=>sList.classList.remove("open"),160));

/* ---- hash routing ---- */
function setHash(id){
  navLock=true;
  const segs=pathOf(id).slice(1);
  location.hash="/"+segs.join("/");
  setTimeout(()=>{navLock=false;},80);
}
window.addEventListener("hashchange",()=>{
  if(navLock) return;
  const segs=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const id=segs.length?segs[segs.length-1]:"universe";
  if(BY_ID[id]&&id!==focusId) jumpTo(id);
});
document.getElementById("brand").addEventListener("click",()=>{
  if(focusId!=="universe") jumpTo("universe");
});

/* ---- labels projection ---- */
const projV=new THREE.Vector3();
function updateLabels(){
  if(labelsHidden) return;
  for(const e of childEntries){
    projV.copy(e.pos).project(camera);
    if(projV.z>1){ e.label.style.display="none"; continue; }
    e.label.style.display="block";
    e.label.style.left=((projV.x*0.5+0.5)*window.innerWidth)+"px";
    e.label.style.top=((-projV.y*0.5+0.5)*window.innerHeight)+"px";
  }
}

/* ================================================================
   4. MAIN LOOP + INIT
   ================================================================ */
let lastT=performance.now();
function loop(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000)||0.016; lastT=ts;
  if(anim){
    anim.t+=dt;
    const k=Math.min(1,anim.t/anim.dur);
    if(anim.mode==="in"){
      const e=easeIO(k);
      cam.target.lerpVectors(anim.fromT,anim.toT,e);
      cam.dist=anim.fromD+(anim.toD-anim.fromD)*e;
      if(k>=1){
        swapFocus(anim.next);
        cam.target.set(0,0,0); cam.dist=defaultDist*1.4;
        anim={mode:"settle",t:0,dur:0.85,fromD:cam.dist,toD:defaultDist};
      }
    } else {
      cam.dist=anim.fromD+(anim.toD-anim.fromD)*easeO(k);
      if(k>=1){ anim=null; hideLabels(false); }
    }
  } else if(ts-lastInteract>4200){
    cam.theta+=dt*0.045;
  }
  for(const s of spinners) s.obj.rotation.y+=s.spd*dt;
  const bg=scene.getObjectByName("bgstars"); if(bg) bg.rotation.y+=dt*0.0035;
  applyCamera();
  renderer.render(scene,camera);
  updateLabels();
  requestAnimationFrame(loop);
}
(function init(){
  const segs=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const startId=(segs.length&&BY_ID[segs[segs.length-1]])?segs[segs.length-1]:"universe";
  swapFocus(startId);
  cam.dist=defaultDist;
  applyCamera();
  setTimeout(()=>{ document.getElementById("hint").style.opacity=0; },7000);
  requestAnimationFrame(loop);
})();
</script>
