  <style>
    /* Responsive light/dark theme variables, container grid, and typography */
    :root {
      --bg: #f8fafc; --surface: #ffffff; --surface-alt: #f1f5f9; --border: #e2e8f0;
      --text: #0f172a; --text-muted: #475569; --accent-blue: #0284c7; --accent-orange: #ea580c;
      --accent-red: #dc2626; --accent-green: #16a34a;
      --font-display: 'Outfit', system-ui, sans-serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html.dark {
      --bg: #070b14; --surface: #0f172a; --surface-alt: #090e1a; --border: #1e293b;
      --text: #f1f5f9; --text-muted: #94a3b8; --accent-blue: #38bdf8; --accent-orange: #f97316;
      --accent-red: #ef4444; --accent-green: #22c55e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: var(--font-sans); scroll-behavior: smooth; background: var(--bg); color: var(--text); line-height: 1.6; }
    body { min-height: 100vh; }
    h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; }
    code, pre, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    header.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.875rem; cursor: pointer; border: 1px solid transparent; text-decoration: none; font-family: inherit; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-orange { background: #ea580c; color: #fff; }
    .btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); }
    section { padding: 64px 0; border-bottom: 1px solid var(--border); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    textarea, input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); font-family: inherit; font-size: 0.95rem; }
    .meta-line { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
  </style>
