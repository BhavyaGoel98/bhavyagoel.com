function runTests(){
 const assert=(condition,label)=>{if(!condition)throw Error('Failed: '+label)};
 try{
  assert(monthEnd('2024-01-31',1)==='2024-02-29','leap February');
  assert(monthEnd('2024-02-29',12)==='2025-02-28','non-leap anniversary');
  assert(!Number.isFinite(dateNumber('2025-02-29')),'invalid date');
  const items=samples(), i=items[0];
  assert(status({...i,exact:'2025-01-10'},'2025-01-10')==='Expiring','inclusive deadline');
  assert(status({...i,exact:'2025-01-10'},'2025-01-11')==='Expired','expired after deadline');
  assert(!visibleReminder({until:11},10)&&visibleReminder({until:10},10)&&!visibleReminder({dismissed:true},10),'reminder state');
  assert(filtered(items,{q:'signal studio',category:'Accessories',sort:'name'}).length===1,'search and category');
  assert(validate(i)===i,'valid data');
  let invalid=false;try{validate({...i,price:-1})}catch{invalid=true}assert(invalid,'invalid price');
  return '9 internal checks passed.';
 }catch(e){return e.message}
}
