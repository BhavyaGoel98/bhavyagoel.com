async function serializeAttachment(a){const {blob,...rest}=a;return {...rest,mime:blob.type,base64:await encodeBlob(blob)}}

function validPrefs(p){if(!p||!['system','light','dark'].includes(p.theme)||!['system','reduce'].includes(p.motion)||!['Local','Day first','ISO'].includes(p.dateFormat)||!priorities.includes(p.priority)||!/^([A-Z]{3})$/.test(p.currency)||!Number.isInteger(Number(p.lead))||Number(p.lead)<0||Number(p.lead)>365||['country','language','extraCategories','timezone'].some(k=>typeof p[k]!=='string'||p[k].length>400))throw Error('Invalid workspace preferences.');if(p.timezone)try{new Intl.DateTimeFormat(undefined,{timeZone:p.timezone})}catch{throw Error('Enter an IANA timezone such as Asia/Kolkata or Europe/London.')}return p}

const validStamp=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\dT/.test(s)&&!isNaN(new Date(s));
async function restore(file){
const payload=await asText(file);

for(const key of tables){if(!Array.isArray(records[key])||records[key].length>50000)throw Error('Missing or invalid '+key+' store.');maps[key]=new Map();for(const r of records[key]){if(!r||!validId(r.id)||maps[key].has(r.id))throw Error('Invalid or duplicate ID in '+key+'.');maps[key].set(r.id,r)}}

for(const a of maps.attachments.values()){if(!fileKeys.has(a.entity)||!source(a.entity,a.entityId)||!validStamp(a.created))throw Error('Invalid attachment owner.');changes.push(['attachments',{id:a.id,entity:a.entity,entityId:a.entityId,name:a.name,created:a.created,blob:await deserializeAttachment(a)},'add'])}

for(const key of ['title','category','priority','description','contact'])r[key]=payload.request[key]??'';
if(!priorities.includes(r.priority)||typeof r.category!=='string'||!r.category)throw Error('The request has an invalid urgency or category.');
const rawProperty=String(payload.request.property??'').slice(0,240), rawUnit=String(payload.request.unit??'').slice(0,240);
r.notes=[rawProperty&&'Submitted property: '+rawProperty,rawUnit&&'Submitted unit: '+rawUnit].filter(Boolean).join('\n');

const changes=[['tenantRequests',r,'add'],log('tenantRequests',r,'Portable request imported')];

function startSetup(){onboarding=1;setupProperty='';setupUnit='';renderSetup()}

if(onboarding===1)showDialog('Welcome to FixKeeper',start+'<p>Set a currency, add a property, and record your first maintenance task.</p>'+btn('Get started','setup-next','','primary')+' '+btn('Skip setup','close'));

case 'pricing':{const annual=trigger.getAttribute('aria-pressed')!=='true';trigger.setAttribute('aria-pressed',annual);trigger.textContent=annual?'Show monthly pricing':'Show annual pricing';document.querySelector('#pro-price').innerHTML=annual?'₹1,999<small style="font-size:.4em"> / year</small>':'₹249<small style="font-size:.4em"> / month</small>';break}
case 'demo-reset':demo=structuredClone(demoSource);demoProperty=Object.keys(demo)[0];demoTab='Work orders';demoUnit='';refreshDemo();notify('Demo reset.');break;
case 'demo-tab':demoTab=value;refreshDemo();break;
case 'demo-detail':{const t=demo[demoProperty].tasks.find(x=>x[1]===value);if(t)showDialog(t[1],'<p>Fictional record · '+e(demoProperty)+' · Unit '+e(t[0])+'</p><p>'+e(t[2])+' · '+e(money(t[4],'INR'))+'</p><label>Status<select data-demo-status="'+e(t[1])+'">'+opts(statuses,t[3])+'</select></label>');break}
case 'privacy':showDialog('Local data and privacy','<p>Workspace records and attachments are stored in your browser’s IndexedDB. Keep a backup if you clear storage or change devices. Optional libraries and fonts load from third-party CDNs when available.</p>');break;
case 'terms':showDialog('Standalone edition','<p>This HTML edition provides local maintenance tracking and exports. Pricing is indicative. Production service terms will be published if a hosted service launches.</p>');break;
case 'close':modal.close();break;
case 'sidebar':if(matchMedia('(max-width:760px)').matches)mobileNav=!mobileNav;else collapsed=!collapsed;document.querySelector('.app').classList.toggle('mobileNav',mobileNav);document.querySelector('.app').classList.toggle('collapsed',collapsed);document.querySelector('.top [data-action="sidebar"]').setAttribute('aria-expanded',String(matchMedia('(max-width:760px)').matches?mobileNav:!collapsed));break;
case 'detail':case 'search-result':go(key,id);break;
case 'new':showEditor(key,'',id&&key==='units'?{propertyId:id}:{});break;
case 'edit':showEditor(key,id);break;
case 'archive':case 'delete':await archiveDelete(key,id,action==='delete');break;
case 'view':view=value;render();break;
case 'reset-filters':filters={};render();break;
case 'upcoming':upcoming=Number(value);render();break;
case 'calendar-mode':calMode=value;render();break;
case 'calendar-nav':{const n=Number(value), d=dateObj(cursor||today());cursor=!n?today():calMode==='Month'?iso(d.getUTCFullYear(),d.getUTCMonth()+n,1):days(cursor,n*(calMode==='Week'?7:31));render();break}
case 'ics-visible':exportICS(lastEvents);break;
case 'ics-one':exportICS(allEvents().filter(x=>x.key===key&&x.record.id===id));break;
case 'schedule':await scheduleChange(id,value);break;
case 'reminder-dismiss':{const x=currentDeadlines().find(x=>x.rid===id);if(x){await commit([['reminders',{id,title:title(x.record),date:x.date}]]);render()}break}
case 'reminder-restore':await commit([['reminders',{id},'delete']]);render();break;
case 'attachment-download':{const a=lookup('attachments',id);if(a)download(a.name,a.blob);break}
case 'attachment-delete':{const a=lookup('attachments',id);if(a&&confirm('Remove this attachment from the workspace?')){const r=lookup(a.entity,a.entityId);await commit([['attachments',a,'delete'],log(a.entity,r,'Removed '+a.name)]);render();notify('Attachment removed.')}break}
case 'report-csv':{const {heads,rows}=reportData();csv('fixkeeper-report-'+today()+'.csv',heads,rows);break}
case 'unit-export':csv('fixkeeper-unit-history.csv',['Date','Record','Category','Status','Vendor','Activity'],scope(all('activityLogs').filter(r=>r.unitId===id)).sort((a,b)=>b.at.localeCompare(a.at)).map(r=>[r.at,r.title,r.category,r.status,label('vendors',r.vendorId),r.message]));break;
case 'print':window.print();break;
case 'backup':await backup();break;
case 'backup-import':showFileImport('backup');break;
case 'request-import':showFileImport('request');break;
case 'portable':showPortable();break;
case 'request-export':{const r=lookup('tenantRequests',id);if(r)await exportRequest(r,attached('tenantRequests',id));break}
case 'convert':{const r=lookup('tenantRequests',id);if(r&&!r.convertedId)showEditor('workOrders','',{propertyId:r.propertyId,unitId:r.unitId,title:r.title,description:r.description,category:r.category,priority:r.priority,notes:r.notes},id);break}
case 'quota':{const p=document.querySelector('#quota');if(!navigator.storage?.estimate){p.textContent='Storage estimates are unavailable in this browser.';break}const {usage,quota}=await navigator.storage.estimate();if(!quota){p.textContent='Storage estimates are unavailable in this browser.';break}const pct=usage/quota*100;p.textContent=(usage/1048576).toFixed(2)+' MB of '+(quota/1048576).toFixed(0)+' MB browser quota used.'+(pct>80?' Storage is running low.':'');break}
case 'clear':if(confirm('Delete all FixKeeper records, preferences, and attachments in this browser profile?')&&confirm('Permanently delete all local workspace data?')){await commit([],true);render();notify('Local workspace cleared.')}break;
case 'onboarding':startSetup();break;
case 'setup-next':advanceSetup();break;
case 'setup-finish':onboarding=0;modal.close();if(route==='dashboard')render();else go('dashboard');break;
}
})});
document.addEventListener('input',event=>{if(event.target.id==='global-search'){clearTimeout(searchTimer);const input=event.target;searchTimer=setTimeout(()=>{if(input.isConnected)searchGlobal(input)},120)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mobileNav&&!modal.open){mobileNav=false;document.querySelector('.app')?.classList.remove('mobileNav');document.querySelector('.top [data-action="sidebar"]')?.setAttribute('aria-expanded','false')}if(event.target.id==='global-search'&&event.key==='Escape')document.querySelector('#global-results').hidden=true;if(event.target.id==='global-search'&&event.key==='ArrowDown'){event.preventDefault();document.querySelector('#global-results:not([hidden]) button')?.focus()}});
document.addEventListener('change',event=>{const t=event.target;run(async()=>{
if(t.id==='demo-property'){demoProperty=t.value;demoUnit='';refreshDemo()}else if(t.id==='demo-unit'){demoUnit=t.value;refreshDemo()}else if(t.dataset.demoStatus){const task=demo[demoProperty].tasks.find(x=>x[1]===t.dataset.demoStatus);if(task){task[3]=t.value;refreshDemo();notify('Demo task updated.')}}else if(t.dataset.orderStatus){await changeStatus(t.dataset.orderStatus,t.value)}else if(t.id==='report-select'){reportIndex=Number(t.value);render()}else if(['record','import'].includes(t.form?.dataset.form)&&['propertyId','unitId'].includes(t.name))updateLinks(t.form);else if(t.type==='file'&&t.closest('[data-drop]'))fileLabel(t.form);
})});
function fileLabel(form){const label=form.querySelector('[data-file-label]');if(label){const files=selectedFiles(form);label.textContent=files.length?files.map(f=>f.name).join(', '):'Up to 10 MB per file'}}
document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-drag]');if(card){event.dataTransfer.setData('text/fixkeeper-order',card.dataset.drag);event.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',event=>{if(event.target.closest('[data-drop],[data-lane]'))event.preventDefault()});
document.addEventListener('drop',event=>{const zone=event.target.closest('[data-drop]'), lane=event.target.closest('[data-lane]');if(zone&&event.dataTransfer.files.length){event.preventDefault();const form=zone.closest('form');form.dropped=[...(form.dropped||[]),...event.dataTransfer.files];fileLabel(form)}else if(lane){event.preventDefault();const id=event.dataTransfer.getData('text/fixkeeper-order');if(id)run(()=>changeStatus(id,lane.dataset.lane))}});
document.addEventListener('submit',event=>{const form=event.target, type=form.dataset.form;if(!type)return;event.preventDefault();if(form.dataset.busy)return;form.dataset.busy='1';const submit=event.submitter;if(submit)submit.disabled=true;const error=form.querySelector('.error');if(error)error.textContent='';(async()=>{
switch(type){
case 'record':await saveRecord(form);break;
case 'filters':filters=Object.fromEntries(new FormData(form));if(filters.from&&filters.to&&filters.from>filters.to)throw Error('Choose an end date after the start date.');render();break;
case 'settings':case 'setup-preferences':{const values=Object.fromEntries(new FormData(form));values.currency=values.currency.toUpperCase();const next=validPrefs({...prefs,...values});await commit([['settings',next]]);if(type==='settings'){render();notify('Preferences saved.')}else advanceSetup();break}
case 'portable':{const r=Object.fromEntries(new FormData(form));const files=selectedFiles(form);if(files.length>15)throw Error('Attach at most 15 files.');const attachments=[];for(const f of files){await inspectFile(f);attachments.push({name:f.name.slice(0,240),blob:f})}await exportRequest(r,attachments);notify('Request file downloaded.');break}
case 'import':{const file=form.elements.payload.files[0];if(!file||file.size>maxBackup)throw Error('Choose a JSON file up to 150 MB.');if(form.dataset.value==='backup'){if(await restore(file)){modal.close();go('dashboard');render();notify('Workspace restored.')}}else{const r=await importRequest(file,form);modal.close();go('tenantRequests',r.id);notify('Tenant request imported.')}break}
}
})().catch(err=>reportError(err,form)).finally(()=>{delete form.dataset.busy;if(submit)submit.disabled=false})});
readRoute(true);
(async()=>{try{db=await openDB();data=await readAll();loadPrefs();ready=true}catch(err){databaseError='Local storage could not open. '+(err.message||'Check your browser storage settings.')}if(route)render()})();
</script></body></html>
