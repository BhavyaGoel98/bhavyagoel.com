<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪐 Planet Destroyer — Destroy it. Then understand it.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --ink:#eaefff; --dim:#8fa0c9;
  --accent:#4cc9f0; --heat:#ff7b1c; --danger:#ff4d6d; --ok:#4ade80;
  --glass:rgba(14,18,40,.62); --glass2:rgba(20,26,56,.78);
  --brd:rgba(120,170,255,.16); --brd-hi:rgba(76,201,240,.45);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
h1,h2,h3,.fs{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.05em}

canvas#bg-canvas{position:fixed;inset:0;z-index:0}
canvas#game-canvas{position:fixed;inset:0;z-index:1;display:none}
body.in-game canvas#game-canvas{display:block}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:3;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;overflow:hidden}
.screen.active{display:flex}
.screen.scrolly{justify-content:flex-start;overflow-y:auto;touch-action:pan-y}

/* ---------- home ---------- */
#home-screen h1{font-size:clamp(1.7rem,6vw,3rem);margin:0 0 6px;text-align:center;
  text-shadow:0 0 22px rgba(76,201,240,.55),0 0 60px rgba(76,201,240,.25)}
#home-screen .tag{color:var(--dim);font-style:italic;margin:0 0 34px;text-align:center;letter-spacing:.03em}
.menu{display:flex;flex-direction:column;gap:14px;width:min(360px,88vw)}
.btn{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.06em;
  background:var(--glass);border:1px solid var(--brd);color:var(--ink);
  padding:15px 20px;border-radius:var(--r);font-size:.95rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .12s,border-color .12s,box-shadow .12s;text-align:center}
.btn:hover,.btn:active{transform:translateY(-2px);border-color:var(--brd-hi);
  box-shadow:0 0 18px rgba(76,201,240,.25)}
.btn.primary{border-color:var(--brd-hi);box-shadow:0 0 14px rgba(76,201,240,.18) inset,0 0 18px rgba(76,201,240,.12)}
.btn.ue{border:1px solid rgba(255,123,28,.55);color:#ffd9b0;position:relative;
  box-shadow:0 0 16px rgba(255,123,28,.18)}

.hr{border:none;border-top:1px dashed rgba(120,170,255,.25);margin:6px 0}
.mini-row{display:flex;gap:12px;justify-content:center;margin-top:26px}
.mini{background:var(--glass);border:1px solid var(--brd);color:var(--ink);
  border-radius:12px;padding:10px 16px;cursor:pointer;font-size:1rem;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.credit{margin-top:26px;color:#5b688f;font-size:.72rem;letter-spacing:.12em}

/* ---------- panel base (select / dossiers / ue) ---------- */
.panel-head{display:flex;align-items:center;gap:12px;width:min(760px,94vw);
  margin:8px auto 16px;position:sticky;top:0;z-index:2}
.panel-head h2{font-size:clamp(1rem,4vw,1.4rem);margin:0;flex:1;
  text-shadow:0 0 16px rgba(76,201,240,.4)}
.back{background:var(--glass2);border:1px solid var(--brd);color:var(--ink);
  border-radius:12px;padding:9px 14px;cursor:pointer;font-size:.85rem;font-weight:600}

.body-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;width:min(760px,94vw);padding-bottom:30px}
.body-card{background:var(--glass);border:1px solid var(--brd);border-radius:var(--r);
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:transform .12s,border-color .12s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.body-card:hover,.body-card:active{transform:translateY(-3px);border-color:var(--brd-hi)}
.body-card .orb{width:58px;height:58px;border-radius:50%}
.body-card .nm{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.05em}
.body-card .ty{color:var(--dim);font-size:.68rem}
.body-card .hp{color:#6f7ea6;font-size:.62rem;letter-spacing:.06em}

/* ---------- dossiers log ---------- */
.log-list{display:flex;flex-direction:column;gap:10px;width:min(620px,94vw);padding-bottom:30px}
.log-item{display:flex;align-items:center;gap:14px;background:var(--glass);
  border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.log-item .orb{width:40px;height:40px;border-radius:50%;flex:none}
.log-item .info{flex:1;min-width:0}
.log-item .info b{font-family:'Orbitron',sans-serif;font-size:.85rem;letter-spacing:.04em}
.log-item .info .sub{color:var(--dim);font-size:.7rem;margin-top:3px}
.log-item .view{background:rgba(76,201,240,.12);border:1px solid var(--brd-hi);
  color:var(--accent);border-radius:10px;padding:8px 13px;cursor:pointer;
  font-size:.75rem;font-weight:700;letter-spacing:.05em}
.empty{color:var(--dim);text-align:center;padding:50px 20px;line-height:1.7}

/* ---------- game HUD ---------- */
#game-screen{pointer-events:none;justify-content:space-between;padding:0}
#hud-top{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(180deg,rgba(5,6,15,.85),transparent)}
#hud-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.9rem;
  letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud-center{flex:1;min-width:0}
#hpbar{height:9px;border-radius:99px;background:rgba(255,255,255,.09);
  border:1px solid var(--brd);overflow:hidden;margin-top:5px}
#hpfill{height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--ok),#f4d35e 55%,var(--danger));
  transition:width .18s}
#hud-kills{font-family:'Orbitron',sans-serif;font-size:.72rem;color:var(--dim);white-space:nowrap}

#tray-wrap{pointer-events:auto;width:100%;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(5,6,15,.9),transparent)}
#tray{display:flex;gap:8px;overflow-x:auto;padding:6px 4px;touch-action:pan-x;
  scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.wpn{flex:none;width:72px;background:var(--glass2);border:1px solid var(--brd);
  border-radius:14px;padding:8px 4px 7px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;position:relative;color:var(--ink);
  transition:border-color .1s,transform .1s}
.wpn .ic{font-size:1.35rem;line-height:1}
.wpn .lb{font-size:.55rem;letter-spacing:.03em;color:var(--dim);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.wpn.sel{border-color:var(--heat);box-shadow:0 0 14px rgba(255,123,28,.45);transform:translateY(-3px)}
.wpn.sel .lb{color:#ffd9b0}
.wpn.locked{opacity:.42;filter:grayscale(.7)}
.wpn .cd{position:absolute;inset:0;border-radius:14px;background:rgba(4,6,18,.72);
  display:none;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:.72rem;color:var(--accent)}
.wpn.cooling .cd{display:flex}
.wpn .lockcap{position:absolute;top:-7px;right:-4px;font-size:.7rem}

/* ---------- dossier modal ---------- */
.overlay{position:fixed;inset:0;z-index:6;display:none;align-items:center;
  justify-content:center;padding:16px;background:rgba(3,4,12,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{width:min(480px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(18,24,54,.96),rgba(8,10,26,.97));
  border:1px solid var(--brd-hi);border-radius:20px;
  box-shadow:0 0 44px rgba(76,201,240,.22),0 24px 60px rgba(0,0,0,.6);
  animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(26px) scale(.94);opacity:0}
  to{transform:none;opacity:1}}
.modal .mhead{padding:18px 20px 12px;border-bottom:1px dashed rgba(120,170,255,.3)}
.modal .mhead h2{margin:0;font-size:1.05rem}
.modal .mhead h2 .boom{color:var(--danger);text-shadow:0 0 14px rgba(255,77,109,.6)}
.modal .stamp{display:inline-block;margin-top:8px;font-family:'Orbitron',sans-serif;
  font-size:.6rem;letter-spacing:.24em;color:var(--heat);
  border:1px solid rgba(255,123,28,.6);border-radius:6px;padding:3px 9px;
  transform:rotate(-2deg)}
.modal .mbody{padding:14px 20px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.dsec{margin-bottom:16px}
.dsec h3{margin:0 0 7px;font-size:.72rem;letter-spacing:.14em;color:var(--accent)}
.dsec p{margin:0;line-height:1.6;font-size:.88rem;color:#d5ddf5}
.dsec ul{margin:0;padding-left:19px;line-height:1.65;font-size:.86rem;color:#d5ddf5}
.dsec li{margin-bottom:3px}
.fun{background:rgba(255,123,28,.09);border-left:3px solid var(--heat);
  border-radius:0 10px 10px 0;padding:10px 12px;font-size:.85rem;line-height:1.55;color:#ffe3c7}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);text-decoration:none;font-size:.78rem;font-weight:600;
  border:1px solid var(--brd-hi);border-radius:99px;padding:6px 13px;
  background:rgba(76,201,240,.08)}
.mfoot{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--brd)}
.mfoot .btn{flex:1;padding:12px 10px;font-size:.8rem}
.btn.copy{background:linear-gradient(135deg,rgba(76,201,240,.22),rgba(76,201,240,.08));
  border-color:var(--brd-hi)}
.btn.ghost{background:transparent}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 2px;border-bottom:1px solid rgba(120,170,255,.1);font-size:.9rem}
.tgl{width:52px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);
  border:1px solid var(--brd);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;background:#aab6d8;transition:transform .15s,background .15s}
.tgl.on{background:rgba(76,201,240,.35)}
.tgl.on::after{transform:translateX(24px);background:var(--accent)}
.btn.dngr{border-color:rgba(255,77,109,.5);color:#ffb3c2;margin-top:16px;width:100%}

/* ---------- toast / misc ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
  z-index:9;background:var(--glass2);border:1px solid var(--brd-hi);color:var(--ink);
  padding:11px 20px;border-radius:99px;font-size:.84rem;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 22px rgba(76,201,240,.25);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#mode-hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));
  transform:translateX(-50%);z-index:4;color:var(--dim);font-size:.72rem;
  letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .4s;
  background:rgba(5,6,15,.55);padding:6px 14px;border-radius:99px}
#mode-hint.show{opacity:1}
@media (max-width:600px){ .body-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="game-canvas"></canvas>

  </div>
</div>

<!-- ============ SETTINGS MODAL ============ -->
<div class="overlay" id="settings-modal">

    <div class="mbody">
      <div class="set-row"><span>🔊 Sound effects</span><div class="tgl" id="tgl-sound"></div></div>

      <button class="btn ghost" id="settings-close">✕ CLOSE</button>

  </div>
</div>

let actx = null;
function A(){
  if(!save.settings.sound) return null;
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function tone(freq0,freq1,dur,type,vol){
  const c=A(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
  o.type=type||"sine";
  o.frequency.setValueAtTime(freq0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,freq1),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,cut){
  const c=A(); if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cut||900;
  const g=c.createGain(); g.gain.value=vol||0.3;
  src.connect(f).connect(g).connect(c.destination); src.start();
}

   6. ENGINE — planets (pseudo-3D spheres), particles, effects
   ================================================================ */
function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(seed){ let a=seed; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

class PlanetEntity{
  constructor(body,x,y,scale){
    this.body=body; this.x=x; this.y=y;
    this.r=body.radiusPx*(scale||1);
    this.hp=body.hp; this.maxHp=body.hp;
    this.rot=Math.random(); this.rotSpd=0.012+Math.random()*0.01;
    this.vx=0; this.vy=0; this.mass=this.r*this.r;
    this.dead=false; this.gone=false;
    this.cracks=[]; this.holes=[];
    const rnd=mulberry(hashSeed(body.id));
    this.features=[];
    const P=body.colorPalette;
    if(body.kind==="gas"){
      const nb=7+Math.floor(rnd()*3);
      for(let i=0;i<nb;i++) this.features.push({band:true, v:-0.85+1.7*(i/(nb-1))+ (rnd()-0.5)*0.06,
        h:0.07+rnd()*0.1, color:[P[0],P[1],P[2]][Math.floor(rnd()*3)], alpha:0.35+rnd()*0.4});
      this.features.push({u:rnd(), v:0.28+(rnd()-0.5)*0.2, w:0.42, h:0.2,
        color:(body.id==="jupiter"?"#c0392b":P[2]), alpha:0.85, spot:true});
    } else if(body.kind==="rock"||body.kind==="comet"){
      const nb=11+Math.floor(rnd()*6);
      for(let i=0;i<nb;i++) this.features.push({u:rnd(), v:(rnd()*1.6-0.8),
        w:0.16+rnd()*0.34, h:0.1+rnd()*0.22,
        color:(rnd()<0.62?P[1]:P[2]), alpha:0.4+rnd()*0.45});
    } else if(body.kind==="star"){
      for(let i=0;i<7;i++) this.features.push({u:rnd(), v:(rnd()*1.5-0.75),
        w:0.12+rnd()*0.2, h:0.09+rnd()*0.12, color:P[2], alpha:0.35+rnd()*0.3});
    }
  }
  get stage(){
    if(this.dead) return 4;
    const p=this.hp/this.maxHp;
    if(p>0.8) return 0; if(p>0.55) return 1; if(p>0.3) return 2; if(p>0.05) return 3; return 4;
  }
  addCracks(lx,ly){
    const n=2+Math.floor(Math.random()*2);
    for(let k=0;k<n && this.cracks.length<30;k++){
      const pts=[[lx,ly]]; let a=Math.random()*Math.PI*2, px=lx, py=ly;
      const steps=3+Math.floor(Math.random()*4);
      for(let i=0;i<steps;i++){
        a+= (Math.random()-0.5)*1.5;
        const len=this.r*(0.12+Math.random()*0.2);
        px+=Math.cos(a)*len; py+=Math.sin(a)*len;
        pts.push([px,py]);
      }
      this.cracks.push(pts);
    }
    if(this.stage>=2 && this.holes.length<9)
      this.holes.push({x:lx*0.8, y:ly*0.8, r:this.r*(0.1+Math.random()*0.14)});
  }
  damage(amount, wx, wy){
    if(this.dead) return;
    this.hp-=amount;
    let lx=(wx!==undefined? wx-this.x : (Math.random()-0.5)*this.r),
        ly=(wy!==undefined? wy-this.y : (Math.random()-0.5)*this.r);
    const d=Math.hypot(lx,ly)||1, m=Math.min(d,this.r*0.9);
    lx=lx/d*m; ly=ly/d*m;
    this.addCracks(lx,ly);
  }
  draw(ctx,t){
    if(this.gone) return;
    const B=this.body, P=B.colorPalette, r=this.r;
    let ox=0, oy=0;
    if(this.stage===3){ ox=(Math.random()-0.5)*3; oy=(Math.random()-0.5)*3; }
    const x=this.x+ox, y=this.y+oy;
    this.rot=(this.rot+this.rotSpd*0.016)%1;

    // comet tail (behind)
    if(B.kind==="comet"){
      const g=ctx.createLinearGradient(x,y,x+r*5,y-r*3.4);
      g.addColorStop(0,"rgba(180,215,255,0.4)"); g.addColorStop(1,"rgba(180,215,255,0)");
      ctx.fillStyle=g; ctx.beginPath();
      ctx.moveTo(x,y-r*0.7); ctx.lineTo(x+r*5,y-r*3.4); ctx.lineTo(x+r*0.6,y+r*0.8);
      ctx.closePath(); ctx.fill();
    }
    // star corona
    if(B.kind==="star"){
      const g=ctx.createRadialGradient(x,y,r*0.6,x,y,r*2.3);
      g.addColorStop(0,"rgba(255,150,20,0.5)"); g.addColorStop(0.5,"rgba(255,110,0,0.16)");
      g.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.3,0,7); ctx.fill();
    }
    // Saturn ring — back half
    if(B.ring){
      ctx.save(); ctx.translate(x,y); ctx.rotate(-0.28);
      ctx.beginPath(); ctx.rect(-r*2.2,-r*2.2,r*4.4,r*2.2); ctx.clip();
      this.drawRing(ctx,r); ctx.restore();
    }
    // sphere
    ctx.save(); ctx.translate(x,y);
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.clip();
    const base=ctx.createLinearGradient(0,-r,0,r);
    base.addColorStop(0,P[0]); base.addColorStop(1,P[1]);
    ctx.fillStyle=base; ctx.fillRect(-r,-r,r*2,r*2);
    for(const f of this.features){
      ctx.globalAlpha=f.alpha; ctx.fillStyle=f.color;
      if(f.band){ ctx.fillRect(-r, f.v*r - f.h*r*0.5, r*2, f.h*r); continue; }
      const lon=(f.u+this.rot)%1, px=(lon*2-1)*r;
      const sq=Math.sqrt(Math.max(0.02,1-(px/r)*(px/r)));
      ctx.beginPath(); ctx.ellipse(px, f.v*r, f.w*r*sq, f.h*r, 0, 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1;
    // damage holes
    for(const h of this.holes){
      ctx.fillStyle="rgba(4,5,14,0.9)";
      ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.fill();
    }
    // magma glow when badly damaged
    if(this.stage>=2){
      const gl=ctx.createRadialGradient(0,0,0,0,0,r);
      const a=this.stage>=3?0.3:0.14;
      gl.addColorStop(0,"rgba(255,110,20,"+(a+0.1*Math.abs(Math.sin(t*0.006)))+")");
      gl.addColorStop(1,"rgba(255,60,0,0)");
      ctx.fillStyle=gl; ctx.fillRect(-r,-r,r*2,r*2);
    }
    // cracks
    if(this.cracks.length){
      ctx.lineCap="round";
      ctx.strokeStyle="rgba(3,4,10,0.8)"; ctx.lineWidth=Math.max(2,r*0.03);
      for(const c of this.cracks){ ctx.beginPath(); ctx.moveTo(c[0][0],c[0][1]);
        for(let i=1;i<c.length;i++) ctx.lineTo(c[i][0],c[i][1]); ctx.stroke(); }
      if(this.stage>=2){
        ctx.strokeStyle="rgba(255,140,40,"+(0.4+0.3*Math.abs(Math.sin(t*0.008)))+")";
        ctx.lineWidth=1.4;
        for(const c of this.cracks){ ctx.beginPath(); ctx.moveTo(c[0][0],c[0][1]);
          for(let i=1;i<c.length;i++) ctx.lineTo(c[i][0],c[i][1]); ctx.stroke(); }
      }
    }
    // shading — highlight + terminator
    const hi=ctx.createRadialGradient(-r*0.42,-r*0.46,r*0.1,-r*0.42,-r*0.46,r*1.5);
    hi.addColorStop(0,"rgba(255,255,255,0.22)"); hi.addColorStop(0.4,"rgba(255,255,255,0.04)");
    hi.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=hi; ctx.fillRect(-r,-r,r*2,r*2);
    if(B.kind!=="star"){
      const sh=ctx.createLinearGradient(-r,0,r,0);
      sh.addColorStop(0,"rgba(0,0,0,0)"); sh.addColorStop(0.55,"rgba(0,0,0,0.05)");
      sh.addColorStop(1,"rgba(0,0,0,0.62)");
      ctx.fillStyle=sh; ctx.fillRect(-r,-r,r*2,r*2);
    }
    ctx.restore();
    // rim glow
    ctx.strokeStyle = B.kind==="star" ? "rgba(255,190,80,0.5)" : "rgba(140,190,255,0.22)";
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
    // Saturn ring — front half
    if(B.ring){
      ctx.save(); ctx.translate(x,y); ctx.rotate(-0.28);
      ctx.beginPath(); ctx.rect(-r*2.2,0,r*4.4,r*2.2); ctx.clip();
      this.drawRing(ctx,r); ctx.restore();
    }
  }
  drawRing(ctx,r){
    const cols=["rgba(233,214,160,0.55)","rgba(180,160,110,0.4)","rgba(233,214,160,0.28)"];
    for(let i=0;i<3;i++){
      ctx.strokeStyle=cols[i]; ctx.lineWidth=r*(0.14-i*0.03);
      ctx.beginPath(); ctx.ellipse(0,0,r*(1.5+i*0.22),r*(0.42+i*0.07),0,0,7); ctx.stroke();
    }
  }
}

let particles=[];
const PCAP = isMobile?260:420;
function spawnBurst(x,y,color,n,spd,size,grav){
  for(let i=0;i<n;i++){
    if(particles.length>=PCAP) particles.shift();
    const a=Math.random()*Math.PI*2, v=(0.3+Math.random())*(spd||3);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      life:0.5+Math.random()*0.8,max:1.3,
      size:(size||3)*(0.5+Math.random()),color,grav:grav||0});
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=p.grav*dt*60;
    p.vx*=0.985; p.vy*=0.985; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(ctx){
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---- screen shake + flash ---- */
let shake=0, flash=0, flashColor="255,255,255";
function addShake(v){ if(save.settings.shake) shake=Math.min(34,shake+v); }

/* ================================================================
   7. WEAPON EFFECTS
   ================================================================ */
let FX=[];
function addFX(e){ e.t=0; e.hitDone=false; FX.push(e); }
function ringWave(x,y,r0,r1,dur,color,lw){
  addFX({dur, draw(ctx,k){
    ctx.strokeStyle=color; ctx.globalAlpha=1-k; ctx.lineWidth=(lw||5)*(1-k*0.6);
    ctx.beginPath(); ctx.arc(x,y,r0+(r1-r0)*k,0,7); ctx.stroke(); ctx.globalAlpha=1;
  }});
}
function clampX(v){ return Math.max(20,Math.min(W-20,v)); }

function fireWeapon(w, tx, ty){
  SFX.fire(w);
  if(w.fx==="beam"){
    const ox=clampX(tx+(Math.random()-0.5)*320), oy=-30;
    addFX({dur:w.thick?560:250, hitAt:60,
      onHit(){ dealDamage(w,tx,ty,1); },
      draw(ctx,k){
        const wl=(w.thick?9:4)*(1+0.35*Math.sin(k*40));
        const g=ctx.createLinearGradient(ox,oy,tx,ty);
        g.addColorStop(0,"rgba(255,255,255,0.9)"); g.addColorStop(1,w.color);
        ctx.save(); ctx.globalCompositeOperation="lighter";
        ctx.strokeStyle=g; ctx.lineWidth=wl; ctx.shadowColor=w.color; ctx.shadowBlur=16;
        ctx.globalAlpha=1-k*k;
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.fillStyle=w.color; ctx.beginPath(); ctx.arc(tx,ty,wl*1.6,0,7); ctx.fill();
        ctx.restore();
      }});
  }
  else if(w.fx==="rail"){
    addFX({dur:200, hitAt:1,
      onHit(){ dealDamage(w,tx,ty,1); flash=0.25; flashColor="160,240,255"; },
      draw(ctx,k){
        ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=1-k;
        ctx.strokeStyle=w.color; ctx.lineWidth=7; ctx.shadowColor=w.color; ctx.shadowBlur=20;
        ctx.beginPath(); ctx.moveTo(-30,ty); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.strokeStyle="#fff"; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(-30,ty); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.restore();
      }});
  }
  else if(w.fx==="bolt"){
    let paths=[], last=-100;
    const mk=()=>{ paths=[];
      for(let b=0;b<4;b++){ const pts=[[clampX(tx+(Math.random()-0.5)*260),-20]];
        const steps=6;
        for(let i=1;i<=steps;i++) pts.push([tx+(Math.random()-0.5)*80*(1-i/steps), -20+(ty+20)*(i/steps)]);
        pts[pts.length-1]=[tx,ty]; paths.push(pts); } };
    mk();
    addFX({dur:340, hitAt:90,
      onHit(){ dealDamage(w,tx,ty,1); },
      update(){ if(this.t-last>60){ mk(); last=this.t; } },
      draw(ctx,k){
        ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=(1-k)*(0.6+0.4*Math.random());
        ctx.strokeStyle=w.color; ctx.lineWidth=2.2; ctx.shadowColor=w.color; ctx.shadowBlur=12;
        for(const p of paths){ ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
          for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.stroke(); }
        ctx.restore();
      }});
  }
  else if(w.fx==="rocks"){
    const n=w.count||1, share=w.dmg/n, rocks=[];
    for(let i=0;i<n;i++){
      const gx=tx+(Math.random()-0.5)*(n>1?170:0), gy=ty+(Math.random()-0.5)*(n>1?120:0);
      const sx=clampX(gx+(Math.random()-0.5)*380), sy=-40-Math.random()*260;
      const d=Math.hypot(gx-sx,gy-sy), spd=(w.fast?24:15)+Math.random()*5;
      rocks.push({x:sx,y:sy,vx:(gx-sx)/d*spd,vy:(gy-sy)/d*spd,gx,gy,
        r:w.big?16:(5+Math.random()*4),landed:false,delay:i*(w.fast?55:110)});
    }
    addFX({dur:999999,
      update(dt){
        let allDone=true;
        for(const rk of rocks){
          if(rk.landed) continue;
          if(rk.delay>0){ rk.delay-=dt; allDone=false; continue; }
          rk.x+=rk.vx*dt/16.7; rk.y+=rk.vy*dt/16.7;
          if(Math.random()<0.5) spawnBurst(rk.x,rk.y,w.color,1,0.7,rk.r*0.35,0);
          if(Math.hypot(rk.gx-rk.x,rk.gy-rk.y)<Math.abs(rk.vy)+6){
            rk.landed=true;
            dealDamage({dmg:share,color:w.color,fx:"rocks"},rk.gx,rk.gy,w.big?1.4:0.6);
          } else allDone=false;
        }
        if(allDone) this.dur=this.t;
      },
      draw(ctx){
        for(const rk of rocks){ if(rk.landed||rk.delay>0) continue;
          ctx.save(); ctx.globalCompositeOperation="lighter";
          ctx.strokeStyle=w.color; ctx.globalAlpha=0.5; ctx.lineWidth=rk.r*0.8;
          ctx.beginPath(); ctx.moveTo(rk.x-rk.vx*2.4,rk.y-rk.vy*2.4); ctx.lineTo(rk.x,rk.y); ctx.stroke();
          ctx.restore();
          ctx.fillStyle="#8a7763"; ctx.beginPath(); ctx.arc(rk.x,rk.y,rk.r,0,7); ctx.fill();
          ctx.fillStyle="rgba(255,255,255,0.25)";
          ctx.beginPath(); ctx.arc(rk.x-rk.r*0.3,rk.y-rk.r*0.3,rk.r*0.45,0,7); ctx.fill();
        }
      }});
  }
  else if(w.fx==="missile"){
    const sx=clampX(tx+(Math.random()-0.5)*60);
    const m={x:sx,y:H+30,spd:6};
    addFX({dur:999999,
      update(dt){
        m.spd=Math.min(26,m.spd*1.06);
        const dx=tx-m.x, dy=ty-m.y, d=Math.hypot(dx,dy)||1;
        m.x+=dx/d*m.spd*dt/16.7; m.y+=dy/d*m.spd*dt/16.7;
        spawnBurst(m.x,m.y+8,"#ffb347",2,1,3,0.02);
        if(d<m.spd+8){
          this.dur=this.t;
          dealDamage(w,tx,ty,w.big?2.2:1.6);
          ringWave(tx,ty,10,w.big?200:140,700,w.color,7);
          ringWave(tx,ty,6,w.big?120:80,500,"#ffffff",3);
          spawnBurst(tx,ty,w.color,50,6,5,0.03);
          spawnBurst(tx,ty,"#ffdd99",30,4,4,0.05);
          addShake(w.big?20:14);
          flash=0.35; flashColor=w.big?"247,37,133":"255,220,120";
          SFX.boom();
        }
      },
      draw(ctx){
        ctx.save(); ctx.translate(m.x,m.y);
        const a=Math.atan2(ty-m.y,tx-m.x)+Math.PI/2;
        ctx.rotate(a);
        ctx.fillStyle="#d8dee9"; ctx.fillRect(-4,-14,8,24);
        ctx.fillStyle=w.color; ctx.beginPath();
        ctx.moveTo(0,-22); ctx.lineTo(6,-12); ctx.lineTo(-6,-12); ctx.closePath(); ctx.fill();
        ctx.restore();
      }});
  }
  else if(w.fx==="flare"){
    const big=!!w.huge, cx=big&&curTarget()?curTarget().x:tx, cy=big&&curTarget()?curTarget().y:ty;
    const r1=big?Math.max(W,H)*0.9:190;
    addFX({dur:big?1100:700, hitAt:big?420:260,
      onHit(){ dealDamage(w,cx,cy,big?3:1.8); addShake(big?24:10); if(big){flash=0.8; flashColor="255,255,255"; SFX.boom();} },
      draw(ctx,k){
        ctx.save(); ctx.globalCompositeOperation="lighter";
        const rr=20+(r1-20)*k;
        const g=ctx.createRadialGradient(cx,cy,rr*0.55,cx,cy,rr);
        g.addColorStop(0,"rgba(255,255,255,0)");
        g.addColorStop(0.8,w.huge?"rgba(255,255,255,"+(0.7*(1-k))+")":"rgba(255,190,60,"+(0.6*(1-k))+")");
        g.addColorStop(1,"rgba(255,120,0,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.fill();
        ctx.restore();
      }});
  }
  else if(w.fx==="crush"){
    const p=curTarget(), cx=p?p.x:tx, cy=p?p.y:ty, R=p?p.r:80;
    addFX({dur:780, hitAt:700,
      onHit(){ dealDamage(w,cx,cy,2); addShake(16); spawnBurst(cx,cy,w.color,40,5,4,0); SFX.impact(); },
      draw(ctx,k){
        ctx.save(); ctx.globalCompositeOperation="lighter";
        for(let i=0;i<3;i++){
          const kk=Math.min(1,k*1.25+i*0.12);
          const rr=R*2.6-(R*2.6-R*0.5)*kk;
          if(rr<=0) continue;
          ctx.strokeStyle=w.color; ctx.globalAlpha=0.65*(1-i*0.22);
          ctx.lineWidth=5-i; ctx.setLineDash([12,10]); ctx.lineDashOffset=this.t*0.06;
          ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.stroke();
        }
        ctx.setLineDash([]); ctx.restore();
      }});
  }
  else if(w.fx==="orb"){
    const dark=!!w.dark;
    addFX({dur:1050, hitAt:650,
      onHit(){ dealDamage(w,tx,ty,2.4); addShake(dark?22:14);
        flash=0.4; flashColor=dark?"123,44,191":"72,149,239";
        ringWave(tx,ty,8,dark?230:160,600,w.color,6); SFX.boom(); },
      update(dt){
        if(Math.random()<0.7){
          const a=Math.random()*Math.PI*2, dist=110+Math.random()*60;
          const px=tx+Math.cos(a)*dist, py=ty+Math.sin(a)*dist;
          if(particles.length>=PCAP) particles.shift();
          particles.push({x:px,y:py,vx:(tx-px)/dist*7,vy:(ty-py)/dist*7,
            life:0.35,max:0.35,size:2.4,color:w.color,grav:0});
        }
      },
      draw(ctx,k){
        const rr=(k<0.62? 10+70*(k/0.62) : 80*(1-(k-0.62)/0.38));
        ctx.save();
        if(!dark) ctx.globalCompositeOperation="lighter";
        const g=ctx.createRadialGradient(tx,ty,0,tx,ty,Math.max(1,rr));
        if(dark){ g.addColorStop(0,"#000"); g.addColorStop(0.7,"#0a0116"); g.addColorStop(1,"rgba(123,44,191,0.9)"); }
        else { g.addColorStop(0,"#fff"); g.addColorStop(0.5,w.color); g.addColorStop(1,"rgba(72,149,239,0)"); }
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(tx,ty,Math.max(1,rr),0,7); ctx.fill();
        ctx.strokeStyle=w.color; ctx.lineWidth=2; ctx.globalAlpha=0.8;
        for(let i=0;i<3;i++){ ctx.beginPath();
          ctx.arc(tx,ty,rr*1.25+i*7, this.t*0.004+i*2.1, this.t*0.004+i*2.1+1.6); ctx.stroke(); }
        ctx.restore(); ctx.globalAlpha=1;
      }});
  }
  else if(w.fx==="ship"){
    const hy=Math.max(80,ty-190), share=w.dmg/5;
    let fired=0, lastShot=0;
    addFX({dur:2400,
      update(dt){
        const ph=this.t;
        if(ph>700 && ph<1900 && fired<5 && ph-lastShot>230){
          fired++; lastShot=ph;
          dealDamage({dmg:share,color:w.color,fx:"beam"},tx+(Math.random()-0.5)*40,ty,0.7);
          tone(1600,300,0.1,"sawtooth",0.07);
        }
      },
      draw(ctx,k){
        const ph=this.t;
        let sx;
        if(ph<700) sx=-90+(tx+90)*(ph/700);
        else if(ph<1900) sx=tx+Math.sin(ph*0.005)*8;
        else sx=tx+(W+120-tx)*((ph-1900)/500);
        const sy=hy+Math.sin(ph*0.004)*5;
        if(ph>700 && ph<1900 && (ph-lastShot)<130){
          ctx.save(); ctx.globalCompositeOperation="lighter";
          ctx.strokeStyle=w.color; ctx.lineWidth=3.5; ctx.shadowColor=w.color; ctx.shadowBlur=14;
          ctx.beginPath(); ctx.moveTo(sx,sy+12); ctx.lineTo(tx,ty); ctx.stroke(); ctx.restore();
        }
        ctx.save(); ctx.translate(sx,sy);
        ctx.fillStyle="rgba(128,255,219,0.35)";
        ctx.beginPath(); ctx.ellipse(0,-8,16,11,0,Math.PI,0); ctx.fill();
        ctx.fillStyle="#3a4a5a"; ctx.beginPath(); ctx.ellipse(0,0,34,11,0,0,7); ctx.fill();
        ctx.fillStyle="#556b80"; ctx.beginPath(); ctx.ellipse(0,-3,34,8,0,Math.PI,0); ctx.fill();
        for(let i=-2;i<=2;i++){
          ctx.fillStyle=(Math.floor(this.t/150)+i)%2===0?"#80ffdb":"#2a6a5a";
          ctx.beginPath(); ctx.arc(i*13,4,2.6,0,7); ctx.fill();
        }
        ctx.restore();
      }});
  }
}

/* ================================================================
   8. GAME LOGIC — modes, damage, destruction → dossier
   ================================================================ */
let mode=null;                 // null | "planet" | "system"
let planetsArr=[], mainPlanet=null;
let currentWeaponId="laser";
let cdUntil={};
let lastAim={x:0,y:0};
let dossierQueue=[];

function curTarget(){
  if(mode==="planet") return (mainPlanet && !mainPlanet.dead && !mainPlanet.gone)?mainPlanet:null;
  if(mode==="system"){
    let best=null,bd=1e9;
    for(const p of planetsArr){ if(p.dead||p.gone) continue;
      const d=Math.hypot(p.x-lastAim.x,p.y-lastAim.y);
      if(d<bd){bd=d;best=p;} }
    return best;
  }
  return null;
}

function dealDamage(w,x,y,burstScale){
  const bs=burstScale||1, col=w.color||"#ffffff";
  spawnBurst(x,y,col,Math.round(14*bs),4*Math.sqrt(bs),3.4,0.02);
  spawnBurst(x,y,"#ffe9c9",Math.round(7*bs),2.6,2.6,0.03);
  addShake(3+Math.min(12,w.dmg*0.02));
  if(w.dmg>=90) SFX.impact();
  if(mode==="planet"){
    if(!mainPlanet||mainPlanet.dead) return;
    mainPlanet.damage(w.dmg,x,y);
    checkDeath(mainPlanet);
  } else if(mode==="system"){
    const AOE=100;
    for(const p of planetsArr){
      if(p.dead||p.gone) continue;
      const d=Math.max(0,Math.hypot(p.x-x,p.y-y)-p.r);
      if(d<AOE){ p.damage(w.dmg*(1-d/AOE),x,y); checkDeath(p); }
    }
  }
}

function checkDeath(p){
  if(p.hp>0||p.dead) return;
  p.dead=true;
  const cols=p.body.colorPalette, px=p.x, py=p.y, pr=p.r;
  SFX.boom(); addShake(26); flash=0.55; flashColor="255,235,200";
  spawnBurst(px,py,cols[0],55,7,5,0.02);
  spawnBurst(px,py,cols[1],40,5,4.4,0.03);
  spawnBurst(px,py,"#ffffff",26,9,3,0.01);
  ringWave(px,py,pr*0.4,pr*3.2,900,"rgba(255,180,80,0.9)",8);
  ringWave(px,py,pr*0.3,pr*2.2,700,"rgba(255,255,255,0.9)",4);
  addFX({dur:1150,
    onEnd(){ p.gone=true; onDestroyed(p.body); },
    draw(ctx,k){
      ctx.save(); ctx.globalCompositeOperation="lighter";
      const rr=pr*(1-k*0.92);
      const g=ctx.createRadialGradient(px,py,0,px,py,Math.max(2,rr*1.6));
      g.addColorStop(0,"rgba(255,255,255,"+(1-k)+")");
      g.addColorStop(0.6,"rgba(255,160,60,"+(0.8*(1-k))+")");
      g.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,Math.max(2,rr*1.6),0,7); ctx.fill();
      ctx.restore();
    }});
  if(!p.gone) p.gone=true; // explosion effect stands in for the body
}

function onDestroyed(body){
  const before=unlockedCount();
  save.destroyed++;
  const entry=save.dossiers.find(d=>d.id===body.id);
  if(entry){ entry.count++; entry.at=Date.now(); }
  else save.dossiers.push({id:body.id,count:1,at:Date.now()});
  persist(); refreshCounts();
  const after=unlockedCount();
  if(after>before){
    const fresh=WEAPONS.filter(w=>w.unlockAt>0&&save.destroyed>=w.unlockAt&&save.destroyed-1<w.unlockAt);
    if(fresh.length){ SFX.unlock();
      setTimeout(()=>showToast("🔓 Unlocked: "+fresh.map(w=>w.icon+" "+w.name).join(", ")),300); }
    renderTray();
  }
  queueDossier(body);
}

function queueDossier(body){
  if(document.getElementById("dossier-modal").classList.contains("open"))
    dossierQueue.push(body);
  else showDossier(body,true);
}

   9. COSMIC DOSSIER — modal + copy-to-clipboard

const dModal=document.getElementById("dossier-modal");
let dossierBody=null;
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function showDossier(body,destroyedMode){
  dossierBody=body;
  const d=body.dossier;
  document.getElementById("dm-title").innerHTML = destroyedMode
    ? '<span class="boom">💥</span> '+esc(body.name.toUpperCase())+' — DESTROYED'
    : '📖 '+esc(body.name.toUpperCase());
  document.getElementById("dm-stamp").textContent =
    "COSMIC DOSSIER · "+body.type.toUpperCase()+" · DECLASSIFIED";
  let h="";
  h+='<div class="dsec"><h3>📛 WHY "'+esc(body.name.toUpperCase())+'"?</h3><p>'+esc(d.nameOrigin)+'</p></div>';
  h+='<div class="dsec"><h3>📊 QUICK FACTS</h3><ul>'+d.quickFacts.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul></div>';
  h+='<div class="dsec"><div class="fun">🌟 <b>Fun fact:</b> '+esc(d.funFact)+'</div></div>';
  if(d.game) h+='<div class="dsec"><h3>🎮 GO DEEPER</h3><p>'+esc(d.game)+'</p></div>';
  h+='<div class="dsec"><h3>🔗 LEARN MORE</h3><div class="links">'+
     d.learnMore.map(l=>'<a href="'+l.url+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join("")+'</div></div>';
  document.getElementById("dm-body").innerHTML=h;
  document.getElementById("dm-body").scrollTop=0;
  dModal.classList.add("open");
}
function buildShareText(body){
  const d=body.dossier;
  let t="🪐 "+body.name.toUpperCase()+" — Cosmic Dossier (via Planet Destroyer)\n\n";
  t+="Why the name? "+d.nameOrigin+"\n\n";
  t+="Quick Facts:\n"+d.quickFacts.map(f=>"- "+f).join("\n")+"\n\n";
  t+="Fun fact: "+d.funFact+"\n\n";
  t+="Learn more: "+d.learnMore[0].url;
  return t;
}
function copyText(txt,ok){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  } else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ showToast("Copy failed — long-press to select"); }
  document.body.removeChild(ta);
}
document.getElementById("dm-copy").addEventListener("click",()=>{
  if(!dossierBody) return;
  copyText(buildShareText(dossierBody),()=>{ SFX.copy(); showToast("Copied! Paste it anywhere 🚀"); });
});
document.getElementById("dm-close").addEventListener("click",()=>{
  dModal.classList.remove("open");
  if(dossierQueue.length){ const nxt=dossierQueue.shift();
    setTimeout(()=>showDossier(nxt,true),260); return; }
  if(mode==="planet"){ navTo("select"); showToast("Pick your next target 🎯"); }
  else if(mode==="system"){
    const alive=planetsArr.some(p=>!p.dead&&!p.gone);
    if(!alive){ showToast("🏆 System obliterated! Every dossier collected."); setTimeout(()=>navTo("home"),1600); }
  }
});

function orbCSS(p){ return "background:radial-gradient(circle at 34% 30%,"+p[2]+" 0%,"+p[0]+" 42%,"+p[1]+" 100%)"; }

function refreshCounts(){

function renderTray(){
  const tray=document.getElementById("tray"); tray.innerHTML="";
  for(const w of WEAPONS){
    const locked=save.destroyed<w.unlockAt;
    const b=document.createElement("button");
    b.className="wpn"+(locked?" locked":"")+(w.id===currentWeaponId?" sel":"");
    b.innerHTML='<span class="ic">'+w.icon+'</span><span class="lb">'+
      (locked?("🔒 "+w.unlockAt+" kills"):w.name)+'</span><span class="cd"></span>'+
      (locked?'<span class="lockcap">🔒</span>':"");
    b.addEventListener("click",()=>{
      if(save.destroyed<w.unlockAt){ showToast("Destroy "+w.unlockAt+" bodies to unlock "+w.icon+" "+w.name); return; }
      currentWeaponId=w.id; SFX.click(); renderTray();
    });
    b.dataset.wid=w.id;
    tray.appendChild(b);
  }
}
function tickCooldowns(){
  const now=performance.now();
  document.querySelectorAll(".wpn").forEach(b=>{
    const until=cdUntil[b.dataset.wid]||0;
    if(now<until){ b.classList.add("cooling");
      b.querySelector(".cd").textContent=((until-now)/1000).toFixed(1); }
    else b.classList.remove("cooling");
  });
}
function renderSelect(){
  const g=document.getElementById("body-grid"); g.innerHTML="";
  for(const b of BODIES){
    const c=document.createElement("div"); c.className="body-card";
    c.innerHTML='<div class="orb" style="'+orbCSS(b.colorPalette)+'"></div>'+
      '<div class="nm">'+b.name.toUpperCase()+'</div><div class="ty">'+b.type+'</div>'+
      '<div class="hp">HP '+b.hp+'</div>';
    c.addEventListener("click",()=>{ SFX.click(); startPlanet(b); });
    g.appendChild(c);
  }
}
function renderLog(){
  const list=document.getElementById("log-list"); list.innerHTML="";
  if(!save.dossiers.length){
    list.innerHTML='<div class="empty">No dossiers yet.<br>Destroy your first celestial body to start the collection. 💥</div>';
    return;
  }
  const sorted=[...save.dossiers].sort((a,b)=>b.at-a.at);
  for(const e of sorted){
    const b=BODY_MAP[e.id]; if(!b) continue;
    const div=document.createElement("div"); div.className="log-item";
    const when=new Date(e.at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    div.innerHTML='<div class="orb" style="'+orbCSS(b.colorPalette)+'"></div>'+
      '<div class="info"><b>'+b.name.toUpperCase()+'</b><div class="sub">'+b.type+
      ' · destroyed ×'+e.count+' · '+when+'</div></div>';
    const v=document.createElement("button"); v.className="view"; v.textContent="VIEW";
    v.addEventListener("click",()=>{ SFX.click(); showDossier(b,false); });
    div.appendChild(v);
    list.appendChild(div);
  }
}

/* ---- navigation ---- */
const SCREENS={home:"home-screen",select:"select-screen",game:"game-screen",
  dossiers:"dossiers-screen"};
function navTo(name){
  if(name!=="game"){ mode=null; planetsArr=[]; mainPlanet=null; FX=[]; particles=[]; dossierQueue=[];
    document.body.classList.remove("in-game");
    document.getElementById("mode-hint").classList.remove("show"); }
  Object.values(SCREENS).forEach(id=>document.getElementById(id).classList.remove("active"));
  document.getElementById(SCREENS[name]).classList.add("active");
  if(name==="home") refreshCounts();
  if(name==="dossiers") renderLog();
}
document.querySelectorAll("[data-nav]").forEach(el=>{
  el.addEventListener("click",()=>{
    const to=el.dataset.nav; SFX.click();
    if(to==="smash"){ renderSelect(); navTo("select"); }
    else if(to==="system"){ startSystem(); }
    else navTo(to);
  });
});
document.getElementById("btn-quit").addEventListener("click",()=>{ SFX.click(); navTo("home"); });

/* ---- settings ---- */
const setModal=document.getElementById("settings-modal");
function syncSettingsUI(){
  document.getElementById("tgl-sound").classList.toggle("on",save.settings.sound);
  document.getElementById("tgl-shake").classList.toggle("on",save.settings.shake);
  document.getElementById("btn-sound").textContent=save.settings.sound?"🔊":"🔇";
}
document.getElementById("btn-settings").addEventListener("click",()=>{ refreshCounts(); syncSettingsUI(); setModal.classList.add("open"); });
document.getElementById("settings-close").addEventListener("click",()=>setModal.classList.remove("open"));
document.getElementById("tgl-sound").addEventListener("click",()=>{ save.settings.sound=!save.settings.sound; persist(); syncSettingsUI(); SFX.click(); });
document.getElementById("tgl-shake").addEventListener("click",()=>{ save.settings.shake=!save.settings.shake; persist(); syncSettingsUI(); SFX.click(); });
document.getElementById("btn-sound").addEventListener("click",()=>{ save.settings.sound=!save.settings.sound; persist(); syncSettingsUI(); SFX.click(); });
let resetArmed=false;
document.getElementById("btn-reset").addEventListener("click",function(){
  if(!resetArmed){ resetArmed=true; this.textContent="⚠ TAP AGAIN TO CONFIRM";
    setTimeout(()=>{resetArmed=false; this.textContent="🗑 RESET ALL PROGRESS";},2600); return; }
  save=defaultSave(); persist(); cdUntil={}; currentWeaponId="laser";
  refreshCounts(); renderTray(); syncSettingsUI();
  this.textContent="🗑 RESET ALL PROGRESS"; resetArmed=false;
  showToast("Progress wiped. Fresh universe. 🌌");
});

/* ================================================================
   11. MODE SETUP + PHYSICS + INPUT
   ================================================================ */
function fitScale(b,mult){
  const maxR=Math.min(W,H)*(mult||0.27);
  return Math.min(1.7,maxR/b.radiusPx);
}
function startPlanet(b){
  mode="planet"; FX=[]; particles=[]; dossierQueue=[];
  mainPlanet=new PlanetEntity(b,W/2,H*0.44,fitScale(b));
  planetsArr=[mainPlanet];
  document.getElementById("hud-name").textContent=b.name.toUpperCase()+" · "+b.type.toUpperCase();
  document.body.classList.add("in-game");
  navToGame("TAP ANYWHERE TO FIRE");
}
function startSystem(){
  mode="system"; FX=[]; particles=[]; dossierQueue=[]; mainPlanet=null;
  planetsArr=[];
  const cx=W/2, cy=H*0.46;
  const sun=new PlanetEntity(BODY_MAP.sun,cx,cy,fitScale(BODY_MAP.sun,0.13));
  sun.isSun=true; planetsArr.push(sun);
  const pool=BODIES.filter(b=>b.id!=="sun");
  const picks=pool.sort(()=>Math.random()-0.5).slice(0,5);
  const MU=900000;
  picks.forEach((b,i)=>{
    const rad=sun.r+90+i*Math.min(72,(Math.min(W,H)-sun.r*2-140)/5);
    const a=Math.random()*Math.PI*2;
    const p=new PlanetEntity(b,cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,fitScale(b,0.075));
    const v=Math.sqrt(MU/rad);
    p.vx=-Math.sin(a)*v; p.vy=Math.cos(a)*v;
    planetsArr.push(p);
  });
  document.getElementById("hud-name").textContent="SYSTEM SMASH";
  document.body.classList.add("in-game");
  navToGame("TAP TO FIRE · DRAG TO FLING A METEOR");
}
function navToGame(hint){
  Object.values(SCREENS).forEach(id=>document.getElementById(id).classList.remove("active"));
  document.getElementById("game-screen").classList.add("active");
  renderTray(); refreshCounts();
  const mh=document.getElementById("mode-hint");
  mh.textContent=hint; mh.classList.add("show");
  clearTimeout(mh._h); mh._h=setTimeout(()=>mh.classList.remove("show"),3600);
}
function systemPhysics(dt){
  const sun=planetsArr.find(p=>p.isSun&&!p.dead&&!p.gone);
  const MU=900000;
  for(const p of planetsArr){
    if(p.dead||p.gone||p.isSun) continue;
    if(sun){
      const dx=sun.x-p.x, dy=sun.y-p.y, d=Math.max(60,Math.hypot(dx,dy));
      const acc=MU/(d*d);
      p.vx+=dx/d*acc*dt; p.vy+=dy/d*acc*dt;
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<p.r*0.5){p.x=p.r*0.5;p.vx=Math.abs(p.vx)*0.8;}
    if(p.x>W-p.r*0.5){p.x=W-p.r*0.5;p.vx=-Math.abs(p.vx)*0.8;}
    if(p.y<p.r*0.5+60){p.y=p.r*0.5+60;p.vy=Math.abs(p.vy)*0.8;}
    if(p.y>H-p.r*0.5-90){p.y=H-p.r*0.5-90;p.vy=-Math.abs(p.vy)*0.8;}
  }
  const alive=planetsArr.filter(p=>!p.dead&&!p.gone);
  for(let i=0;i<alive.length;i++) for(let j=i+1;j<alive.length;j++){
    const a=alive[i],b=alive[j];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
    if(d>0&&d<min){
      const nx=dx/d, ny=dy/d, push=(min-d)/2;
      if(!a.isSun){a.x-=nx*push; a.y-=ny*push;}
      if(!b.isSun){b.x+=nx*push; b.y+=ny*push;}
      const rel=Math.abs((b.vx-a.vx)*nx+(b.vy-a.vy)*ny);
      const dmg=Math.min(220,rel*1.6+18);
      const ix=a.x+nx*a.r, iy=a.y+ny*a.r;
      a.damage(dmg,ix,iy); b.damage(dmg,ix,iy);
      spawnBurst(ix,iy,"#ffcf7d",12,3.4,3,0.02); SFX.impact(); addShake(5);
      const tmp=rel*0.9+30;
      if(!a.isSun){a.vx-=nx*tmp*0.5; a.vy-=ny*tmp*0.5;}
      if(!b.isSun){b.vx+=nx*tmp*0.5; b.vy+=ny*tmp*0.5;}
      checkDeath(a); checkDeath(b);
    }
  }
}
function tryFire(x,y){
  if(!mode) return;
  if(mode==="planet"&&(!mainPlanet||mainPlanet.dead)) return;
  const w=WPN_MAP[currentWeaponId];
  if(save.destroyed<w.unlockAt) return;
  const now=performance.now();
  if(now<(cdUntil[w.id]||0)) return;
  cdUntil[w.id]=now+w.cd;
  lastAim={x,y};
  if(mode==="planet"&&mainPlanet){
    const dx=x-mainPlanet.x, dy=y-mainPlanet.y, d=Math.hypot(dx,dy);
    if(d>mainPlanet.r){ x=mainPlanet.x+dx/d*mainPlanet.r*0.92; y=mainPlanet.y+dy/d*mainPlanet.r*0.92; }
    lastAim={x,y};
  }
  fireWeapon(w,x,y);
}
function flingMeteor(x0,y0,dx,dy){
  const d=Math.hypot(dx,dy)||1, spd=Math.min(30,10+d*0.06);
  const m={x:x0,y:y0,vx:dx/d*spd,vy:dy/d*spd};
  SFX.fire(WPN_MAP.meteor);
  addFX({dur:999999,
    update(dt){
      m.x+=m.vx*dt/16.7; m.y+=m.vy*dt/16.7;
      if(Math.random()<0.6) spawnBurst(m.x,m.y,"#ffb26b",1,0.6,3,0);
      for(const p of planetsArr){
        if(p.dead||p.gone) continue;
        if(Math.hypot(p.x-m.x,p.y-m.y)<p.r+11){
          dealDamage({dmg:140,color:"#ffb26b",fx:"rocks"},m.x,m.y,1.2);
          this.dur=this.t; return;
        }
      }
      if(m.x<-90||m.x>W+90||m.y<-90||m.y>H+90) this.dur=this.t;
    },
    draw(ctx){
      ctx.fillStyle="#8a7763"; ctx.beginPath(); ctx.arc(m.x,m.y,11,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.25)";
      ctx.beginPath(); ctx.arc(m.x-3,m.y-3,5,0,7); ctx.fill();
    }});
}
let pDown=null;
gC.addEventListener("pointerdown",e=>{
  e.preventDefault();
  const x=e.clientX, y=e.clientY;
  pDown={x,y,t:performance.now()};
  if(mode==="planet") tryFire(x,y);
});
gC.addEventListener("pointerup",e=>{
  if(!pDown) return;
  const dx=e.clientX-pDown.x, dy=e.clientY-pDown.y;
  if(mode==="system"){
    if(Math.hypot(dx,dy)>44) flingMeteor(pDown.x,pDown.y,dx,dy);
    else tryFire(pDown.x,pDown.y);
  }
  pDown=null;
});
gC.addEventListener("pointercancel",()=>{pDown=null;});

/* ================================================================
   12. MAIN LOOP
   ================================================================ */
let lastT=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000)||0.016; lastT=ts;
  drawStars(ts);
  if(mode){
    if(mode==="system") systemPhysics(dt);
    updateParticles(dt);
    const dtMs=dt*1000;
    for(let i=FX.length-1;i>=0;i--){
      const e=FX[i]; e.t+=dtMs;
      if(e.update) e.update(dtMs);
      if(e.hitAt!==undefined&&!e.hitDone&&e.t>=e.hitAt){ e.hitDone=true; if(e.onHit) e.onHit(); }
      if(e.t>=e.dur){ if(e.onEnd) e.onEnd(); FX.splice(i,1); }
    }
    gX.clearRect(0,0,W,H);
    gX.save();
    if(shake>0.3){ gX.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.88; }
    else shake=0;
    for(const p of planetsArr) if(!p.gone&&!p.dead) p.draw(gX,ts);
    for(const e of FX){ if(e.draw) e.draw(gX,Math.min(1,e.t/e.dur)); }
    drawParticles(gX);
    gX.restore();
    if(flash>0.01){
      gX.fillStyle="rgba("+flashColor+","+flash+")";
      gX.fillRect(0,0,W,H); flash*=0.86;
    } else flash=0;
    if(mode==="planet"&&mainPlanet){
      document.getElementById("hpfill").style.width=Math.max(0,mainPlanet.hp/mainPlanet.maxHp*100)+"%";
    } else if(mode==="system"){
      const alive=planetsArr.filter(p=>!p.dead&&!p.gone).length;
      document.getElementById("hud-name").textContent="SYSTEM SMASH · "+alive+" LEFT";
      document.getElementById("hpfill").style.width=(alive/Math.max(1,planetsArr.length)*100)+"%";
    }
    tickCooldowns();
  }
  requestAnimationFrame(loop);
}

/* ---- init ---- */
refreshCounts(); syncSettingsUI(); renderTray();
requestAnimationFrame(loop);
</script>
