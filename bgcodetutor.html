<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>BG Code Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BG CODE TUTOR — Design Tokens
   ============================================================ */
:root{
  --bg0:#000000;          /* void */
  --bg1:#0A0F0A;          /* panel */
  --bg2:#111B12;          /* raised */
  --glass:rgba(255,255,255,.055);
  --glass-brd:rgba(255,255,255,.09);
  --violet:#39FF14;       /* primary accent (neon green) */
  --violet-deep:#16A34A;
  --violet-soft:#86EFAC;
  --cyan:#22D3EE;         /* code / info */
  --gold:#FBBF24;         /* coins */
  --flame:#FB7185;        /* streak / lives */
  --green:#34D399;        /* success */
  --red:#F87171;
  --diamond:#7DD3FC;
  --text:#EAF5EA;
  --dim:#8FA396;
  --faint:#54615A;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --disp:'Unbounded',sans-serif;
  --ui:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --glow:0 0 24px rgba(57,255,20,.4);
}
[data-theme="cyan"]{--violet:#22D3EE;--violet-deep:#0891B2;--violet-soft:#A5F3FC;--glow:0 0 24px rgba(34,211,238,.4)}
[data-theme="sunset"]{--violet:#FB923C;--violet-deep:#EA580C;--violet-soft:#FED7AA;--glow:0 0 24px rgba(251,146,60,.4)}
[data-theme="violet"]{--violet:#8B5CF6;--violet-deep:#6D28D9;--violet-soft:#C4B5FD;--glow:0 0 24px rgba(57,255,20,.45)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#040208;font-family:var(--ui);color:var(--text);
  display:flex;justify-content:center;align-items:center;overflow:hidden;
}
button{font-family:var(--ui);border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:var(--ui);color:var(--text)}
::-webkit-scrollbar{width:0;height:0}

/* ---------- App frame ---------- */
#phone{
  position:relative;width:min(430px,100vw);height:min(932px,100dvh);
  background:var(--bg0);overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:480px){#phone{border-radius:40px;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 120px rgba(22,163,74,.25)}}

#aurora{
  position:absolute;inset:-20% -20% auto -20%;height:60%;pointer-events:none;z-index:0;
  background:
    radial-gradient(38% 45% at 25% 18%, rgba(57,255,20,.20), transparent 70%),
    radial-gradient(30% 38% at 78% 8%, rgba(34,211,238,.16), transparent 70%),
    radial-gradient(26% 30% at 55% 40%, rgba(22,163,74,.16), transparent 70%);
  filter:blur(10px);animation:aurora 14s ease-in-out infinite alternate;
}
@keyframes aurora{to{transform:translateX(4%) translateY(3%) scale(1.06)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
.no-motion *{animation-duration:.001s!important;transition-duration:.001s!important}

#view{position:relative;z-index:1;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 18px calc(96px + env(safe-area-inset-bottom))}
.layer{position:absolute;inset:0;z-index:5;background:var(--bg0);overflow-y:auto;padding:18px 18px 40px;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Tab bar ---------- */
#tabbar{
  position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;
  display:flex;justify-content:space-around;padding:8px 6px;
  background:rgba(20,14,36,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-brd);border-radius:26px;box-shadow:var(--shadow);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:16px;color:var(--faint);transition:color .2s,transform .15s}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:600;letter-spacing:.04em}
.tab.on{color:var(--violet-soft)}
.tab.on svg{filter:drop-shadow(0 0 8px var(--violet))}
.tab:active{transform:scale(.9)}

/* ---------- Shared components ---------- */
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-lg);padding:16px;backdrop-filter:blur(8px)}
.card+.card,.card+.sec-h,.sec-h+.card{margin-top:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px}
.sec-h h3{font-size:15px;font-weight:700;letter-spacing:.02em}
.sec-h button{font-size:12px;color:var(--violet-soft);font-weight:600}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.big-num{font-family:var(--disp);font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:18px;font-size:15px;font-weight:700;letter-spacing:.02em;
  background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;
  box-shadow:0 8px 24px rgba(22,163,74,.4);transition:transform .12s,filter .2s;
}
.btn:active{transform:scale(.965)}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-brd);box-shadow:none;color:var(--text)}
.btn.small{width:auto;padding:9px 16px;font-size:13px;border-radius:13px}
.btn:disabled{filter:grayscale(.7) brightness(.6);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-brd);font-size:12.5px;font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .12s}
.iconbtn:active{transform:scale(.88)}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .5s cubic-bezier(.22,1,.36,1)}

/* ---------- Header / stat chips ---------- */
.stat-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.stat-row .chip{flex-shrink:0}
.hello h1{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.15;margin-top:2px}
.hello{margin-bottom:16px}

/* ---------- Streak / hero cards ---------- */
.hero-cta{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(57,255,20,.28),rgba(34,211,238,.10)),var(--glass)}
.hero-cta .glowring{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(57,255,20,.5),transparent 70%);pointer-events:none}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini-grid .card{margin:0}
.stat-cell{text-align:left}
.stat-cell .big-num{font-size:24px;margin:4px 0 2px}
.stat-cell .lbl{font-size:11px;color:var(--dim);font-weight:600}

/* ---------- Course cards ---------- */
.course-card{display:flex;align-items:center;gap:14px;transition:transform .15s}
.course-card:active{transform:scale(.98)}
.course-ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;background:var(--bg2);border:1px solid var(--glass-brd)}
.course-meta{flex:1;min-width:0}
.course-meta h4{font-size:15px;font-weight:700}
.course-meta p{font-size:12px;color:var(--dim);margin:3px 0 7px}
.course-card.locked{opacity:.45;filter:saturate(.4)}
.soon-tag{font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--dim)}

/* ---------- Learning trail (signature) ---------- */
.trail-wrap{position:relative;margin-top:8px}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail-svg path{fill:none;stroke:rgba(57,255,20,.25);stroke-width:4;stroke-dasharray:2 10;stroke-linecap:round}
.trail-svg path.lit{stroke:var(--violet);stroke-dasharray:none;filter:drop-shadow(0 0 6px rgba(57,255,20,.8));stroke-width:4.5}
.node-row{position:relative;display:flex;padding:14px 0;z-index:1}
.node{
  width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg2);border:2px solid var(--glass-brd);font-size:26px;position:relative;transition:transform .15s;
}
.node:active{transform:scale(.92)}
.node .st{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim);margin-top:1px}
.node.done{background:linear-gradient(135deg,var(--violet),var(--violet-deep));border-color:var(--violet-soft);box-shadow:var(--glow)}
.node.done .st{color:#fff}
.node.next{border-color:var(--violet);box-shadow:0 0 0 6px rgba(57,255,20,.15),var(--glow);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(57,255,20,.14),var(--glow)}50%{box-shadow:0 0 0 11px rgba(57,255,20,.05),var(--glow)}}
.node.lock{opacity:.4}
.unit-h{margin:20px 0 4px;display:flex;align-items:center;gap:10px}
.unit-h .line{flex:1;height:1px;background:var(--glass-brd)}
.unit-h span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--violet-soft)}

/* ---------- Lesson player ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lesson-top .pbar{flex:1}
.hearts{display:flex;gap:2px;font-size:14px}
.ex-label{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);padding:4px 9px;border-radius:8px;margin-bottom:10px}
.ex-q{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:14px}
.codeblock{font-family:var(--mono);font-size:13.5px;line-height:1.7;background:#0D0919;border:1px solid var(--glass-brd);border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px;overflow-x:auto;white-space:pre}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--glass);border:1.5px solid var(--glass-brd);font-size:14.5px;font-weight:600;margin-bottom:10px;transition:all .15s;font-family:var(--ui)}
.opt code{font-family:var(--mono);font-size:13px}
.opt:active{transform:scale(.98)}
.opt.pick{border-color:var(--violet);background:rgba(57,255,20,.14)}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.14)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.opt .key{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--dim);flex-shrink:0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.bank .tok{padding:9px 14px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--glass-brd);font-family:var(--mono);font-size:13.5px;font-weight:600;transition:all .15s}
.tok.used{opacity:.25;pointer-events:none}
.blank{display:inline-block;min-width:76px;border-bottom:2px solid var(--violet);text-align:center;color:var(--violet-soft);font-family:var(--mono);padding:0 4px}
.arr-list .tok{display:block;width:100%;text-align:left;margin-bottom:8px}
.arr-slot{min-height:44px;border:1.5px dashed var(--glass-brd);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:13.5px;color:var(--violet-soft);background:rgba(57,255,20,.06)}
.type-in{width:100%;padding:14px 16px;border-radius:16px;background:#0D0919;border:1.5px solid var(--glass-brd);font-family:var(--mono);font-size:14.5px;outline:none}
.type-in:focus{border-color:var(--violet)}
.verdict{position:sticky;bottom:0;margin:18px -18px -40px;padding:16px 18px calc(20px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;animation:slideUp .25s}
.verdict.ok{background:linear-gradient(180deg,rgba(52,211,153,.16),rgba(52,211,153,.05)) ,var(--bg1);border-top:1px solid rgba(52,211,153,.4)}
.verdict.no{background:linear-gradient(180deg,rgba(248,113,113,.15),rgba(248,113,113,.05)),var(--bg1);border-top:1px solid rgba(248,113,113,.4)}
.verdict h4{font-size:16px;font-weight:800;margin-bottom:4px}
.verdict p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:12px}
.combo{position:fixed;top:18%;left:50%;transform:translateX(-50%);font-family:var(--disp);font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.6);animation:comboPop 1s forwards;pointer-events:none;z-index:99}
@keyframes comboPop{0%{transform:translateX(-50%) scale(.4);opacity:0}25%{transform:translateX(-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateX(-50%) translateY(-30px) scale(1);opacity:0}}

/* ---------- Complete screen ---------- */
.done-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:30px 10px}
.done-wrap .trophy{font-size:64px;animation:trophyIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes trophyIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.done-wrap h2{font-family:var(--disp);font-size:24px;margin:14px 0 6px}
.reward-row{display:flex;gap:12px;margin:22px 0 28px}
.reward{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:14px 20px;text-align:center}
.reward .big-num{font-size:22px}
.reward .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

/* ---------- Playground ---------- */
.pg-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.lang-pick{display:flex;gap:6px}
.lang-pick .chip.on{background:rgba(57,255,20,.2);border-color:var(--violet);color:var(--violet-soft)}
.editor-wrap{position:relative;border-radius:var(--r-md);border:1px solid var(--glass-brd);background:#0D0919;overflow:hidden}
.editor-wrap textarea,.editor-wrap pre{
  font-family:var(--mono);font-size:13px;line-height:1.65;padding:14px;margin:0;
  min-height:230px;width:100%;white-space:pre;overflow-wrap:normal;overflow:auto;tab-size:2;
}
.editor-wrap pre{position:absolute;inset:0;pointer-events:none;color:#C9C3E4}
.editor-wrap textarea{position:relative;background:transparent;color:transparent;caret-color:var(--cyan);border:none;outline:none;resize:vertical;z-index:1}
.tk-kw{color:#39FF14}.tk-str{color:#FDE68A}.tk-num{color:#FBBF24}.tk-fn{color:#67E8F9}.tk-cm{color:#5A527A;font-style:italic}
.console{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:#07040F;border:1px solid var(--glass-brd);border-radius:var(--r-md);padding:13px 15px;min-height:80px;margin-top:12px;white-space:pre-wrap;color:#B7E6C6}
.console .err{color:var(--red)}
.console .dim{color:var(--faint)}

/* ---------- Leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.lb-row:last-child{border:none}
.lb-rank{font-family:var(--disp);font-size:14px;font-weight:700;width:28px;color:var(--dim)}
.lb-row.me{background:rgba(57,255,20,.12);border-radius:14px;padding:12px 10px;border:1px solid rgba(57,255,20,.3)}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--bg2);border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.lb-name{flex:1;font-size:14px;font-weight:700}
.lb-name small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.lb-xp{font-size:13px;font-weight:800;color:var(--violet-soft)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:18px 0 8px}
.pod{text-align:center;flex:1}
.pod .avatar{width:56px;height:56px;font-size:28px;margin:0 auto 8px;border-radius:18px}
.pod .bar{border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(57,255,20,.35),rgba(57,255,20,.05));border:1px solid var(--glass-brd);border-bottom:none;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--disp);font-weight:700}
.pod.p1 .avatar{box-shadow:0 0 22px rgba(251,191,36,.5);border-color:var(--gold)}
.pod .nm{font-size:12px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .xp{font-size:11px;color:var(--dim);margin-bottom:8px}

/* ---------- Heatmap / achievements / profile ---------- */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06)}
.heat i.h1{background:rgba(57,255,20,.3)}.heat i.h2{background:rgba(57,255,20,.55)}.heat i.h3{background:var(--violet);box-shadow:0 0 6px rgba(57,255,20,.6)}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{text-align:center;padding:14px 6px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--glass-brd)}
.ach .ico{font-size:26px}
.ach h5{font-size:11px;font-weight:700;margin-top:6px}
.ach p{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.ach.off{opacity:.35;filter:grayscale(1)}
.prof-head{text-align:center;padding:10px 0 4px}
.prof-head .avatar{width:84px;height:84px;font-size:42px;margin:0 auto 12px;border-radius:26px;box-shadow:var(--glow);border-color:var(--violet)}
.prof-head h2{font-family:var(--disp);font-size:20px}
.prof-head .rank{font-size:12px;color:var(--violet-soft);font-weight:700;margin-top:4px;letter-spacing:.06em}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;font-weight:600}
.setrow:last-child{border:none}
.switch{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;transition:background .2s}
.switch.on{background:var(--violet)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on i{left:23px}

/* ---------- Onboarding ---------- */
.ob{display:flex;flex-direction:column;min-height:100%;padding:30px 6px 20px}
.ob .art{font-size:76px;text-align:center;margin:40px 0 26px;filter:drop-shadow(0 0 30px rgba(57,255,20,.5))}
.ob h1{font-family:var(--disp);font-size:26px;text-align:center;line-height:1.25}
.ob p{text-align:center;color:var(--dim);font-size:14px;line-height:1.6;margin:12px 0 auto}
.ob .grad{background:linear-gradient(90deg,var(--violet-soft),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;justify-content:center;margin:22px 0}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.15);transition:all .3s}
.dots i.on{width:22px;background:var(--violet)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.av-grid button{aspect-ratio:1;border-radius:18px;background:var(--glass);border:2px solid var(--glass-brd);font-size:28px;transition:all .15s}
.av-grid button.on{border-color:var(--violet);background:rgba(57,255,20,.15);box-shadow:var(--glow)}
.name-in{width:100%;padding:16px;border-radius:18px;background:var(--glass);border:1.5px solid var(--glass-brd);font-size:16px;font-weight:600;outline:none;text-align:center;margin:14px 0}
.name-in:focus{border-color:var(--violet)}
.goal-row{display:flex;gap:10px;margin:14px 0}
.goal-row button{flex:1;padding:14px 6px;border-radius:16px;background:var(--glass);border:2px solid var(--glass-brd);font-weight:700;font-size:13px}
.goal-row button.on{border-color:var(--violet);background:rgba(57,255,20,.15)}
.goal-row small{display:block;font-weight:500;color:var(--dim);font-size:10px;margin-top:3px}

/* ---------- Modal / toast / confetti ---------- */
#modal-root:not(:empty){position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(4,2,8,.7);backdrop-filter:blur(4px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:relative;width:min(430px,100vw);max-height:86dvh;overflow-y:auto;background:var(--bg1);border:1px solid var(--glass-brd);border-radius:28px 28px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:slideUp .3s cubic-bezier(.22,1,.36,1)}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.15);margin:0 auto 18px}
#toast-root{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(380px,92vw);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(29,21,51,.95);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}}
.confetti{position:fixed;top:-10px;z-index:98;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- Tutor chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.msg{max-width:85%;padding:12px 15px;border-radius:18px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--violet),var(--violet-deep));border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-brd);border-bottom-left-radius:6px}
.msg.bot code{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.chat-bar{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.chat-bar input{flex:1;padding:13px 16px;border-radius:18px;background:rgba(29,21,51,.95);border:1px solid var(--glass-brd);outline:none;font-size:14px}
.chat-bar button{width:48px;border-radius:16px;background:linear-gradient(135deg,var(--violet),var(--violet-deep));font-size:18px}

/* ---------- Misc ---------- */
.back{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--dim);margin-bottom:14px}
.week-chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px}
.week-chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week-chart .bar{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--violet),rgba(57,255,20,.15));min-height:4px;transition:height .5s}
.week-chart .b.today .bar{background:linear-gradient(180deg,var(--cyan),rgba(34,211,238,.2))}
.week-chart small{font-size:9px;color:var(--faint);font-weight:700}
.cert-canvas{width:100%;border-radius:14px;border:1px solid var(--glass-brd)}
.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
.empty .ico{font-size:36px;display:block;margin-bottom:8px}

/* ---------- Mac terminal ---------- */
.macterm{background:#050505;border:1px solid #1E2A1E;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(57,255,20,.14);font-family:var(--mono);text-align:left;margin:30px 0 26px}
.macterm .tbar{display:flex;align-items:center;gap:7px;padding:10px 13px;background:#101010;border-bottom:1px solid #1E2A1E}
.macterm .tbar i{width:11px;height:11px;border-radius:50%}
.macterm .tbar i:nth-child(1){background:#FF5F57}.macterm .tbar i:nth-child(2){background:#FEBC2E}.macterm .tbar i:nth-child(3){background:#28C840}
.macterm .tbar small{margin-left:auto;font-size:10px;color:#3F4F41;font-family:var(--ui);font-weight:600}
.macterm .tbody{padding:15px;font-size:12.5px;line-height:1.75;min-height:92px;white-space:pre-wrap;color:var(--violet)}
.macterm .tbody .pr{color:#5F7D63}
.tcursor{display:inline-block;width:8px;height:14px;background:var(--violet);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.av-grid img{width:100%;height:100%;object-fit:cover;border-radius:15px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.inline-av{display:inline-flex;width:30px;height:30px;border-radius:10px;overflow:hidden;vertical-align:-7px;background:var(--bg2);align-items:center;justify-content:center}
.course-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.course-grid .card{margin:0}

/* ---------- Tablet & laptop ---------- */
@media(min-width:768px){
  #phone{width:100vw;height:100dvh;border-radius:0;border:none;box-shadow:none}
  #view{padding:32px max(28px,calc(50% - 480px)) 130px}
  .layer{padding:32px max(28px,calc(50% - 390px)) 70px}
  #tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(580px,94vw)}
  .mini-grid{grid-template-columns:repeat(4,1fr)}
  .course-grid{grid-template-columns:repeat(2,1fr)}
  .ach-grid{grid-template-columns:repeat(6,1fr)}
  .heat{grid-template-columns:repeat(28,1fr)}
  .editor-wrap textarea,.editor-wrap pre{min-height:320px;font-size:14px}
  .chat-bar{left:50%;right:auto;transform:translateX(-50%);width:min(740px,94vw)}
  #modal-root:not(:empty){align-items:center}
  .sheet{border-radius:28px;width:min(600px,94vw)}
  .ob{max-width:600px;margin:0 auto;width:100%}
  .ex-q{font-size:21px}
}
@media(min-width:1200px){
  .course-grid{grid-template-columns:repeat(3,1fr)}
  #view{padding-left:max(28px,calc(50% - 560px));padding-right:max(28px,calc(50% - 560px))}
}

<body>
<div id="phone">
  <div id="aurora"></div>
  <main id="view"></main>
  <nav id="tabbar" hidden></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* ================= CORE: utils / store / audio / haptics ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avHTML=a=>a&&String(a).startsWith('data:')?`<img src="${a}" alt="avatar">`:(a||'🙂');
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);
   const cv=document.createElement('canvas');cv.width=cv.height=160;
   cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
   cb(cv.toDataURL('image/jpeg',.85))};img.src=r.result};r.readAsDataURL(f)};i.click()}
const todayKey=()=>new Date().toISOString().slice(0,10);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const Store={
  KEY:'bgct2',
  d:null,
  def(){return{
    profile:null, xp:0, coins:120, diamonds:2, lives:5, lastLifeTs:Date.now(),
    streak:0, lastActive:null, lastChest:null,
    prog:{},               // courseId -> array of completed lesson ids
    days:{},               // date -> xp earned
    ach:[],                // unlocked achievement ids
    certs:[],              // completed course ids
    themes:['neon'], theme:'neon',
    sound:true, haptics:true, motion:true,
    stats:{answers:0,correct:0,lessons:0,perfect:0,challenges:0},
    tutor:[],
  }},
  load(){try{this.d={...this.def(),...JSON.parse(localStorage.getItem(this.KEY)||'{}')}}catch(e){this.d=this.def()} return this.d},
  save(){localStorage.setItem(this.KEY,JSON.stringify(this.d))},
  reset(){localStorage.removeItem(this.KEY);location.reload()},
};
let S=Store.load();

const Haptic={tap(){if(S.haptics&&navigator.vibrate)navigator.vibrate(8)},ok(){if(S.haptics&&navigator.vibrate)navigator.vibrate([12,40,12])},no(){if(S.haptics&&navigator.vibrate)navigator.vibrate([50,30,50])},win(){if(S.haptics&&navigator.vibrate)navigator.vibrate([15,30,15,30,40])}};

const Sfx=(()=>{let ctx;const ac=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());
  function tone(f,t,dur,type='sine',vol=.15){if(!S.sound)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t);g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur)}catch(e){}}
  return{
    tap(){tone(660,0,.06,'sine',.08)},
    ok(){tone(523,0,.1);tone(784,.08,.14)},
    no(){tone(220,0,.18,'square',.09)},
    coin(){tone(988,0,.07,'triangle');tone(1319,.06,.12,'triangle')},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,'triangle',.14))},
    chest(){[392,523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.15,'sine',.12))},
  };
})();

function toast(ico,msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${ico}</span><span>${esc(msg)}</span>`;$('#toast-root').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2600)}
function confetti(n=60){if(!S.motion)return;const cs=['#39FF14','#22D3EE','#FBBF24','#34D399','#FB7185'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px;background:${cs[i%5]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function sheet(html,onMount){const r=$('#modal-root');r.innerHTML=`<div class="scrim"></div><div class="sheet"><div class="grab"></div>${html}</div>`;r.querySelector('.scrim').onclick=closeSheet;if(onMount)onMount(r.querySelector('.sheet'))}
function closeSheet(){$('#modal-root').innerHTML=''}

/* ================= GAMIFY ================= */
const Gamify={
  LEVELS:[0,60,150,300,500,780,1150,1600,2200,3000,4000,5300,7000,9000,12000],
  RANKS:[[1,'Bronze Coder','🥉'],[3,'Silver Coder','🥈'],[5,'Gold Coder','🥇'],[7,'Sapphire Dev','💠'],[9,'Amethyst Dev','🔮'],[12,'Code Legend','👑']],
  level(){let l=1;this.LEVELS.forEach((t,i)=>{if(S.xp>=t)l=i+1});return l},
  levelPct(){const l=this.level();const lo=this.LEVELS[l-1]??0,hi=this.LEVELS[l]??(lo+3000);return clamp((S.xp-lo)/(hi-lo)*100,0,100)},
  rank(){const l=this.level();let r=this.RANKS[0];this.RANKS.forEach(x=>{if(l>=x[0])r=x});return r},
  addXP(n){S.xp+=n;const d=todayKey();S.days[d]=(S.days[d]||0)+n;this.touchStreak();Store.save()},
  addCoins(n){S.coins+=n;Sfx.coin();Store.save()},
  touchStreak(){const t=todayKey();if(S.lastActive===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastActive===y?S.streak+1:1;S.lastActive=t;Store.save();if(S.streak>1)toast('🔥',`${S.streak} day streak!`)},
  tickLives(){const MAX=5,MS=30*60*1000;if(S.lives>=MAX){S.lastLifeTs=Date.now();return}const gained=Math.floor((Date.now()-S.lastLifeTs)/MS);if(gained>0){S.lives=clamp(S.lives+gained,0,MAX);S.lastLifeTs=S.lives>=MAX?Date.now():S.lastLifeTs+gained*MS;Store.save()}},
  loseLife(){if(S.lives>=5)S.lastLifeTs=Date.now();S.lives=clamp(S.lives-1,0,5);Store.save()},
  nextLifeMin(){return Math.max(0,Math.ceil((S.lastLifeTs+30*60*1000-Date.now())/60000))},
};

const ACH=[
 {id:'first',ico:'🐣',n:'First Steps',d:'Complete your first lesson',t:s=>s.stats.lessons>=1},

 {id:'ten',ico:'🎓',n:'Scholar',d:'Complete 10 lessons',t:s=>s.stats.lessons>=10},
 {id:'perfect',ico:'💯',n:'Flawless',d:'Perfect lesson, no mistakes',t:s=>s.stats.perfect>=1},
 {id:'streak3',ico:'🔥',n:'On Fire',d:'3 day streak',t:s=>s.streak>=3},
 {id:'streak7',ico:'⚡',n:'Unstoppable',d:'7 day streak',t:s=>s.streak>=7},
 {id:'xp500',ico:'🚀',n:'Rising Star',d:'Earn 500 XP',t:s=>s.xp>=500},

 {id:'sharp',ico:'🎯',n:'Sharpshooter',d:'100 correct answers',t:s=>s.stats.correct>=100},
 {id:'daily',ico:'🗓️',n:'Challenger',d:'Finish 3 daily challenges',t:s=>s.stats.challenges>=3},
];
function checkAch(){ACH.forEach(a=>{if(!S.ach.includes(a.id)&&a.t(S)){S.ach.push(a.id);S.diamonds+=1;Store.save();Sfx.win();Haptic.win();toast(a.ico,`Achievement: ${a.n}! +1 💎`)}})}

/* Simulated weekly leaderboard */
const BOTS=[['Aarav','🦊'],['Priya','🐼'],['Kabir','🐯'],['Ananya','🦄'],['Rohan','🐸'],['Ishita','🐨'],['Dev','🦁'],['Meera','🐙'],['Arjun','🤖'],['Sara','🐳']];
function weekSeed(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);return d.getFullYear()*100+Math.ceil(((d-onejan)/864e5+onejan.getDay()+1)/7)}
function rng(seed){return()=>{seed=(seed*9301+49297)%233280;return seed/233280}}
function weekXP(){const start=new Date();start.setDate(start.getDate()-start.getDay());let x=0;for(let i=0;i<7;i++){const k=new Date(start.getTime()+i*864e5).toISOString().slice(0,10);x+=S.days[k]||0}return x}
function leaderboard(){const r=rng(weekSeed());const dayFrac=(new Date().getDay()+1)/7;
  const rows=BOTS.map(([n,a],i)=>({n,a,xp:Math.round((80+r()*520)*dayFrac+i*7),me:false}));
  rows.push({n:S.profile?.name||'You',a:S.profile?.avatar||'🙂',xp:weekXP(),me:true});
  return rows.sort((a,b)=>b.xp-a.xp)}

/* ================= PLAYGROUND: highlighter, JS runner, Python-subset interpreter ================= */
const HL={
 py:{kw:/\b(def|return|if|elif|else|for|while|in|and|or|not|True|False|None|print|range|len|str|int|break|continue)\b/g},
 js:{kw:/\b(const|let|var|function|return|if|else|for|while|true|false|null|undefined|console|log|break|continue|new|typeof)\b/g},
};
function highlight(code,lang){let h=esc(code);
 h=h.replace(/(&quot;.*?&quot;|'[^'\n]*'|`[^`\n]*`)/g,'\u0001$1\u0002');
 h=h.replace(/(#[^\n\u0001]*|\/\/[^\n\u0001]*)/g,'\u0003$1\u0004');
 h=h.replace(/\b(\d+\.?\d*)\b/g,'<i class="tk-num">$1</i>');
 const kw=(HL[lang]||HL.js).kw;h=h.replace(kw,'<i class="tk-kw">$&</i>');
 h=h.replace(/\u0001([\s\S]*?)\u0002/g,'<i class="tk-str">$1</i>').replace(/\u0003([\s\S]*?)\u0004/g,'<i class="tk-cm">$1</i>');
 return h}

function runJS(code){const out=[];const fake={log:(...a)=>out.push(a.map(v=>typeof v==='object'?JSON.stringify(v):String(v)).join(' '))};
 try{new Function('console',code)(fake);return{out:out.join('\n')||'(no output)'}}catch(e){return{out:out.join('\n'),err:e.message}}}

/* Compact Python-subset interpreter: print, variables, arithmetic, strings, bool,
   comparisons, and/or/not, if/elif/else, while, for-in-range, str/int/len, +=. */
function runPY(src){
 const out=[];let steps=0;const STEP_MAX=20000;
 const lines=src.replace(/\t/g,'  ').split('\n');
 const blocks=parse(0,lines.length,0);
 try{exec(blocks,{});return{out:out.join('\n')||'(no output)'}}
 catch(e){return{out:out.join('\n'),err:e.message}}

 function indentOf(l){const m=l.match(/^ */);return m[0].length}
 function parse(start,end,ind){const res=[];let i=start;
  while(i<end){const raw=lines[i];if(!raw.trim()||raw.trim().startsWith('#')){i++;continue}
   if(indentOf(raw)<ind)break; if(indentOf(raw)>ind)throw new Error('IndentationError on line '+(i+1));
   const line=raw.trim();
   const m=line.match(/^(if|elif|else|while|for)\b(.*?):$/);
   if(m){const body=[];let j=i+1;while(j<end&&(!lines[j].trim()||indentOf(lines[j])>ind))j++;
    res.push({kind:m[1],head:m[2].trim(),body:parse(i+1,j,ind+2),line:i});i=j}
   else{res.push({kind:'stmt',src:line,line:i});i++}}
  return res}
 function exec(nodes,env){for(let i=0;i<nodes.length;i++){const n=nodes[i];guard();
   if(n.kind==='stmt'){stmt(n.src,env)}
   else if(n.kind==='if'){let done=truthy(evalExpr(n.head,env));if(done)exec(n.body,env);
     while(i+1<nodes.length&&(nodes[i+1].kind==='elif'||nodes[i+1].kind==='else')){i++;const b=nodes[i];
       if(!done){if(b.kind==='else'){exec(b.body,env);done=true}else if(truthy(evalExpr(b.head,env))){exec(b.body,env);done=true}}}}
   else if(n.kind==='while'){while(truthy(evalExpr(n.head,env))){guard();exec(n.body,env)}}
   else if(n.kind==='for'){const fm=n.head.match(/^(\w+)\s+in\s+range\((.*)\)$/);if(!fm)throw new Error('Only "for x in range(...)" is supported');
     const args=splitArgs(fm[2]).map(a=>evalExpr(a,env));let[st,en,sp]=args.length===1?[0,args[0],1]:args.length===2?[args[0],args[1],1]:args;
     for(let v=st;sp>0?v<en:v>en;v+=sp){guard();env[fm[1]]=v;exec(n.body,env)}}
   else if(n.kind==='elif'||n.kind==='else')throw new Error((n.kind)+' without if (line '+(n.line+1)+')');}}
 function stmt(s,env){let m;
  if(m=s.match(/^print\((.*)\)$/)){out.push(splitArgs(m[1]).map(a=>disp(evalExpr(a,env))).join(' '));return}
  m=s.match(/^([A-Za-z_]\w*)\s*(\+|-|\*|\/)?=(?!=)\s*(.+)$/);
  if(m){const[,name,op,rhs]=m;const v=evalExpr(rhs,env);
   env[name]=op?applyOp(op,env[name],v):v;return}
  evalExpr(s,env)}
 function guard(){if(++steps>STEP_MAX)throw new Error('Too many steps — infinite loop?')}
 function truthy(v){return v!==0&&v!==false&&v!==''&&v!=null}
 function disp(v){return v===true?'True':v===false?'False':String(v)}
 function splitArgs(s){const r=[];let d=0,q=null,cur='';for(const ch of s){if(q){cur+=ch;if(ch===q)q=null;continue}
   if(ch==='"'||ch==="'"){q=ch;cur+=ch}else if('([{'.includes(ch)){d++;cur+=ch}else if(')]}'.includes(ch)){d--;cur+=ch}
   else if(ch===','&&d===0){r.push(cur.trim());cur=''}else cur+=ch}if(cur.trim())r.push(cur.trim());return r}
 function applyOp(op,a,b){if(op==='+'){if(typeof a==='string'||typeof b==='string')return String(a)+String(b);return a+b}
  if(op==='-')return a-b;if(op==='*')return typeof a==='string'?a.repeat(b):a*b;if(op==='/')return a/b;
  if(op==='//')return Math.floor(a/b);if(op==='%')return((a%b)+b)%b;if(op==='**')return Math.pow(a,b)}
 function evalExpr(s,env){let i=0;s=s.trim();
  const peek=()=>s[i],eat=re=>{const m=s.slice(i).match(re);if(m&&m.index===0){i+=m[0].length;return m[0]}return null};
  const ws=()=>{while(s[i]===' ')i++};
  function orE(){let a=andE();while(true){ws();if(eat(/^or\b/)){const b=andE();a=truthy(a)?a:b}else return a}}
  function andE(){let a=notE();while(true){ws();if(eat(/^and\b/)){const b=notE();a=truthy(a)?b:a}else return a}}
  function notE(){ws();if(eat(/^not\b/))return!truthy(notE());return cmp()}
  function cmp(){let a=add();while(true){ws();const op=eat(/^(==|!=|<=|>=|<|>)/);if(!op)return a;const b=add();
   a=op==='=='?a===b:op==='!='?a!==b:op==='<'?a<b:op==='>'?a>b:op==='<='?a<=b:a>=b}}
  function add(){let a=mul();while(true){ws();const op=eat(/^(\+|-)(?!=)/);if(!op)return a;a=applyOp(op,a,mul())}}
  function mul(){let a=pow();while(true){ws();const op=eat(/^(\/\/|\*\*|\*|\/|%)/);if(!op)return a;
   if(op==='**')a=applyOp('**',a,pow());else a=applyOp(op,a,pow())}}
  function pow(){return unary()}
  function unary(){ws();if(eat(/^-/))return -unary();return atom()}
  function atom(){ws();
   if(eat(/^\(/)){const v=orE();ws();if(!eat(/^\)/))throw new Error('Missing )');return v}
   let m;
   if(m=eat(/^\d+\.\d+/))return parseFloat(m); if(m=eat(/^\d+/))return parseInt(m);
   if(m=eat(/^"((?:[^"\\]|\\.)*)"/)||(m=eat(/^'((?:[^'\\]|\\.)*)'/)))return m.slice(1,-1).replace(/\\n/g,'\n').replace(/\\(['"\\])/g,'$1');
   if(eat(/^True\b/))return true; if(eat(/^False\b/))return false; if(eat(/^None\b/))return null;
   if(m=eat(/^(str|int|len|abs)\s*\(/)){const fn=m.replace(/\s*\($/,'');const arg=orE();ws();if(!eat(/^\)/))throw new Error('Missing )');
    if(fn==='str')return disp(arg); if(fn==='int')return parseInt(arg); if(fn==='len')return String(arg).length; return Math.abs(arg)}
   if(m=eat(/^[A-Za-z_]\w*/)){if(!(m in env))throw new Error("NameError: '"+m+"' is not defined");return env[m]}
   throw new Error('SyntaxError near: '+s.slice(i,i+12))}
  const v=orE();ws();if(i<s.length)throw new Error('SyntaxError near: '+s.slice(i,i+12));return v}
}

/* -------- Signature: serpentine glowing trail -------- */
function openTrail(c){
 const done=S.prog[c.id]||[];let unlocked=true;
 const l=pushLayer(`<button class="back" id="bk">← Back</button>
 <div class="hello"><span class="eyebrow">Learning path</span><h1>${c.ico} ${c.name}</h1></div>
 <div class="pbar"><i style="width:${courseDone(c)/allLessons(c).length*100}%"></i></div>
 ${c.units.map(u=>`<div class="unit-h"><span>${u.name}</span><div class="line"></div></div>
  <div class="trail-wrap" data-trail>
   ${u.lessons.map((ls,i)=>{const isDone=done.includes(ls.id);const state=isDone?'done':unlocked?'next':'lock';if(!isDone)unlocked=false;
    const align=i%2===0?'flex-start':'flex-end';const pad=i%2===0?'padding-left:12%':'padding-right:12%';
    return`<div class="node-row" style="justify-content:${align};${pad}">
     <button class="node ${state}" data-l="${ls.id}" ${state==='lock'?'disabled':''}>${state==='lock'?'🔒':ls.ico}<span class="st">${esc(ls.name)}</span></button></div>`}).join('')}
   <svg class="trail-svg" data-svg preserveAspectRatio="none"></svg>
  </div>`).join('')}
 ${courseDone(c)===allLessons(c).length?`<button class="btn" style="margin-top:18px" id="crt">📜 View certificate</button>`:''}`);
 l.querySelector('#bk').onclick=()=>{Haptic.tap();popLayer()};
 if(l.querySelector('#crt'))l.querySelector('#crt').onclick=()=>showCert(c);
 l.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{Haptic.tap();const ls=allLessons(c).find(x=>x.id===b.dataset.l);openLesson(c,ls)});
 requestAnimationFrame(()=>l.querySelectorAll('[data-trail]').forEach(w=>drawTrail(w,done)));
}
function drawTrail(wrap,done){const svg=wrap.querySelector('[data-svg]');const nodes=[...wrap.querySelectorAll('.node')];if(nodes.length<2)return;
 const wr=wrap.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);
 let lit='',dim='';for(let i=0;i<nodes.length-1;i++){const a=nodes[i].getBoundingClientRect(),b=nodes[i+1].getBoundingClientRect();
  const x1=a.left-wr.left+a.width/2,y1=a.top-wr.top+a.height/2,x2=b.left-wr.left+b.width/2,y2=b.top-wr.top+b.height/2;
  const midY=(y1+y2)/2;const d=`M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2} `;
  if(nodes[i].classList.contains('done'))lit+=d;else dim+=d}
 svg.innerHTML=`<path d="${dim}"/><path class="lit" d="${lit}"/>`}

let L=null; // live lesson state
function openLesson(course,lesson,mode){
 Gamify.tickLives();
 if(S.lives<=0&&mode!=='daily'){sheet(`<div style="text-align:center"><div style="font-size:54px">💔</div><h2 style="font-family:var(--disp);font-size:19px;margin:12px 0 6px">Out of lives</h2>
  <p style="color:var(--dim);font-size:13px;margin-bottom:16px">Next life in ${Gamify.nextLifeMin()} min — or refill now.</p>
  <button class="btn" id="rf">🪙 Refill 5 lives · 100 coins</button><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Wait</button></div>`,
  el=>el.querySelector('#rf').onclick=()=>{if(S.coins<100)return toast('🪙','Not enough coins');S.coins-=100;S.lives=5;Store.save();Sfx.coin();closeSheet();openLesson(course,lesson,mode)});return}
 const exs=mode==='daily'?lesson.ex:shuffle(lesson.ex);
 L={course,lesson,mode,exs,i:0,wrong:0,combo:0,layer:pushLayer('')};
 renderEx();
}
function renderEx(){
 const ex=L.exs[L.i];
 const hearts=L.mode==='daily'?'⏱️':[...Array(5)].map((_,i)=>i<S.lives?'❤️':'🖤').join('');
 L.layer.innerHTML=`<div class="lesson-top">
   <button class="iconbtn" id="quit">✕</button>
   <div class="pbar"><i style="width:${L.i/L.exs.length*100}%"></i></div>
   <span class="hearts">${hearts}</span></div>
  <span class="ex-label">${ex.label||{mcq:'Multiple choice',fib:'Fill the blank',arrange:'Arrange the code',type:'Type the code'}[ex.t]}</span>
  <div class="ex-q">${esc(ex.q)}</div>
  ${ex.code?`<div class="codeblock">${highlight(ex.code,L.course.id==='py'?'py':'js')}</div>`:''}
  <div id="ex-body"></div>
  <button class="btn ghost small" id="hint" style="margin-top:4px">💡 Hint · 10 🪙</button>
  <div id="verdict-slot"></div>`;
 L.layer.querySelector('#quit').onclick=()=>{Haptic.tap();sheet(`<div style="text-align:center"><h2 style="font-family:var(--disp);font-size:18px;margin-bottom:8px">Quit lesson?</h2><p style="color:var(--dim);font-size:13px;margin-bottom:16px">Progress in this lesson will be lost.</p><button class="btn" onclick="closeSheet();popLayer()">Quit</button><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Keep going</button></div>`)};
 L.layer.querySelector('#hint').onclick=()=>{if(S.coins<10)return toast('🪙','Not enough coins');S.coins-=10;Store.save();Sfx.coin();toast('💡',hintFor(ex))};
 const body=L.layer.querySelector('#ex-body');
 ({mcq:buildMCQ,fib:buildFIB,arrange:buildARR,type:buildTYPE})[ex.t](body,ex);
 L.layer.scrollTop=0;
}
function hintFor(ex){if(ex.t==='mcq')return 'Think: '+ex.x.split('.')[0]+'.';if(ex.t==='fib')return 'It starts with "'+ex.ans[0]+'".';if(ex.t==='type')return 'Answer has '+ex.ans.length+' characters.';return 'First line: '+ex.lines[0]}
function norm(s){return s.replace(/\s+/g,' ').replace(/["']/g,'"').trim().toLowerCase()}

function buildMCQ(el,ex){el.innerHTML=ex.c.map((c,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span><code>${esc(c)}</code></button>`).join('');
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(L.locked)return;L.locked=true;const ok=+b.dataset.i===ex.a;
  b.classList.add(ok?'right':'wrong');if(!ok)el.querySelector(`[data-i="${ex.a}"]`).classList.add('right');verdict(ok,ex)})}
function buildFIB(el,ex){const parts=ex.tpl.split('___');
 el.innerHTML=`<div class="codeblock" style="margin-bottom:8px">${esc(parts[0])}<span class="blank" id="bl">?</span>${esc(parts[1]||'')}</div>
 <div class="bank">${shuffle(ex.bank).map(t=>`<button class="tok" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
 el.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{if(L.locked)return;L.locked=true;const v=b.dataset.v;
  el.querySelector('#bl').textContent=v;const ok=v===ex.ans;b.style.borderColor=ok?'var(--green)':'var(--red)';verdict(ok,ex)})}
function buildARR(el,ex){const sh=shuffle(ex.lines.map((l,i)=>({l,i})));let picked=[];
 el.innerHTML=`<div id="slots">${ex.lines.map(()=>`<div class="arr-slot"></div>`).join('')}</div>
 <div class="bank arr-list" id="bank">${sh.map((o,k)=>`<button class="tok" data-i="${o.i}" data-k="${k}"><code>${esc(o.l)}</code></button>`).join('')}</div>
 <button class="btn ghost small" id="undo">↩ Undo</button>`;
 const slots=el.querySelectorAll('.arr-slot');
 const refresh=()=>{slots.forEach((s,i)=>s.textContent=picked[i]!=null?ex.lines[picked[i]]:'')};
 el.querySelectorAll('#bank .tok').forEach(b=>b.onclick=()=>{if(L.locked||b.classList.contains('used'))return;Haptic.tap();Sfx.tap();
  picked.push(+b.dataset.i);b.classList.add('used');refresh();
  if(picked.length===ex.lines.length){L.locked=true;const ok=picked.every((v,i)=>v===i);
   slots.forEach(s=>s.style.borderColor=ok?'var(--green)':'var(--red)');verdict(ok,ex)}});
 el.querySelector('#undo').onclick=()=>{if(L.locked||!picked.length)return;const last=picked.pop();
  el.querySelector(`#bank .tok[data-i="${last}"]`).classList.remove('used');refresh()}}
function buildTYPE(el,ex){el.innerHTML=`<input class="type-in" id="ti" placeholder="Type your answer…" autocomplete="off" spellcheck="false">
 <button class="btn" style="margin-top:12px" id="chk">Check</button>`;
 const inp=el.querySelector('#ti');inp.focus();
 const check=()=>{if(L.locked)return;L.locked=true;const ok=norm(inp.value)===norm(ex.ans);
  inp.style.borderColor=ok?'var(--green)':'var(--red)';verdict(ok,ex)};
 el.querySelector('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()}}

function verdict(ok,ex){
 S.stats.answers++;if(ok){S.stats.correct++;L.combo++;Sfx.ok();Haptic.ok();
  if(L.combo>=3){const c=document.createElement('div');c.className='combo';c.textContent=`${L.combo}× COMBO!`;document.body.appendChild(c);setTimeout(()=>c.remove(),1000)}}
 else{L.wrong++;L.combo=0;Sfx.no();Haptic.no();if(L.mode!=='daily')Gamify.loseLife()}
 Store.save();
 const slot=L.layer.querySelector('#verdict-slot');
 slot.innerHTML=`<div class="verdict ${ok?'ok':'no'}">
  <h4 style="color:${ok?'var(--green)':'var(--red)'}">${ok?['Nice!','Correct!','Brilliant!','You got it!'][Math.floor(Math.random()*4)]:'Not quite'}</h4>
  <p>${esc(ex.x)}</p><button class="btn" id="next">${L.i+1<L.exs.length?'Continue':'Finish'}</button></div>`;
 slot.querySelector('#next').onclick=()=>{L.locked=false;L.i++;
  if(L.i<L.exs.length){if(S.lives<=0&&L.mode!=='daily'){popLayer();openLesson(L.course,L.lesson)}else renderEx()}
  else finishLesson()}}

function finishLesson(){
 const perfect=L.wrong===0;
 let xp=L.exs.length*5+(perfect?15:0),coins=10+(perfect?10:0);
 if(L.mode==='daily'){xp*=2;coins+=20;S.stats.challenges++;S.lastDaily=todayKey()}
 else{const arr=S.prog[L.course.id]=S.prog[L.course.id]||[];
  if(!arr.includes(L.lesson.id)){arr.push(L.lesson.id);S.stats.lessons++;if(perfect)S.stats.perfect++}
  if(arr.length===allLessons(L.course).length&&!S.certs.includes(L.course.id)){S.certs.push(L.course.id);setTimeout(()=>showCert(L.course),600)}}
 Gamify.addXP(xp);S.coins+=coins;Store.save();Sfx.win();Haptic.win();confetti(80);
 L.layer.innerHTML=`<div class="done-wrap">
  <div class="trophy">${perfect?'🏆':'🎉'}</div>
  <h2>${perfect?'Flawless!':'Lesson complete!'}</h2>
  <p style="color:var(--dim);font-size:13px">${L.mode==='daily'?'Daily challenge crushed — 2× XP applied':esc(L.lesson?.name||'')} · ${L.exs.length-L.wrong}/${L.exs.length} correct</p>
  <div class="reward-row">
   <div class="reward"><div class="big-num" style="color:var(--violet-soft)">+${xp}</div><div class="lbl">XP</div></div>

/* ================= AI TUTOR (Claude API when available, offline fallback) ================= */
function tutorFallback(q,code,lang){q=q.toLowerCase();
 if(q.includes('error')||q.includes('bug'))return "Debug checklist:\n1. Read the error's line number\n2. Check quotes, brackets & colons pair up\n3. Check spelling of variable names\n4. print() values midway to see what's happening";
 if(q.includes('loop'))return lang==='py'?"Python loop pattern:\nfor i in range(5):\n  print(i)\n\nrange(5) → 0,1,2,3,4. Indentation defines the body.":"JS loop pattern:\nfor (let i = 0; i < 5; i++) {\n  console.log(i)\n}";
 if(q.includes('function'))return lang==='py'?"def greet(name):\n  return \"Hi \" + name\n\nprint(greet(\"BG\"))":"function greet(name) {\n  return `Hi ${name}`\n}\nconsole.log(greet('BG'))";
 if(q.includes('variable'))return "A variable is a labelled box for a value.\nPython: score = 10\nJS: let score = 10\nUse the name to reuse the value anywhere below.";
 return "I can help with loops, functions, variables, and errors — ask about any of those, or paste code and ask \"why is this broken?\". (Full AI mode activates when this app runs inside Claude.)"}
function openTutor(code,lang){
 const l=pushLayer(`<button class="back" id="bk">← Back</button>
 <div class="hello"><span class="eyebrow">BG Tutor</span><h1>🤖 Ask anything</h1></div>
 <div class="chat" id="chat"><div class="msg bot">Hey ${esc(S.profile.name)}! I'm your coding tutor. Ask me to explain code, fix a bug, or teach a concept. I'll guide you — not just hand over answers. 💜</div></div>
 <div class="chat-bar"><input id="ci" placeholder="e.g. explain my loop…"><button id="cs">➤</button></div>`);
 l.querySelector('#bk').onclick=popLayer;
 const chat=l.querySelector('#chat'),ci=l.querySelector('#ci');
 async function send(){const q=ci.value.trim();if(!q)return;ci.value='';
  chat.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(q)}</div>`);
  const th=document.createElement('div');th.className='msg bot';th.textContent='…thinking';chat.appendChild(th);th.scrollIntoView();
  let reply;
  try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:
   `You are BG Tutor inside a coding education app. Be encouraging, concise (<120 words), guide with hints before answers. Student's ${lang==='py'?'Python':'JavaScript'} code:\n${code||'(none)'}\n\nQuestion: ${q}`}]})});
   const d=await res.json();reply=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')||tutorFallback(q,code,lang)}
  catch(e){reply=tutorFallback(q,code,lang)}
  th.textContent=reply;th.scrollIntoView()}
 l.querySelector('#cs').onclick=send;ci.onkeydown=e=>{if(e.key==='Enter')send()};
}
