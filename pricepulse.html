<div id="root"></div>
<script>
(function(){
  var STAMP = "PricePulse v5.1 - start fresh moved into hero CTA row";
  console.log("%c" + STAMP, "background:#0F1522;color:#3ED598;padding:3px 8px;border-radius:4px;font-weight:700");
  var shown = false;
  function mounted(){ var r=document.getElementById("root"); return !!(r && r.textContent && r.textContent.trim().length>40); }
  function report(detail){
    if (shown) return; shown = true;
    if (mounted()) {
      var bar=document.createElement("div"); bar.setAttribute("role","status");
      bar.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#FBE9ED;border:1px solid #F1C4CC;color:#C22740;border-radius:12px;padding:12px 16px;font:600 13px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(15,21,34,.18);max-width:640px;margin:0 auto";
      bar.innerHTML='<b>Something went wrong in one part of the app.</b> Everything else still works.<pre style="white-space:pre-wrap;font:400 11.5px/1.5 ui-monospace,monospace;color:#5C6472;margin:8px 0 0;max-height:120px;overflow:auto">'+detail+'</pre>';
      var x=document.createElement("button"); x.textContent="Dismiss";
      x.style.cssText="margin-top:10px;background:#C22740;color:#fff;border:none;padding:6px 14px;border-radius:8px;font:700 12px system-ui;cursor:pointer";
      x.onclick=function(){ bar.remove(); shown=false; };
      bar.appendChild(x); document.body.appendChild(bar);
    } else {
      var r=document.getElementById("root"); if(!r) return;
      r.innerHTML='<div style="font-family:system-ui,sans-serif;max-width:620px;margin:60px auto;padding:26px;border:1px solid #F1C4CC;background:#FBE9ED;border-radius:14px;color:#C22740"><h2 style="margin:0 0 10px;font-size:19px">PricePulse could not start</h2><pre style="white-space:pre-wrap;font-size:13px;color:#1B2333;margin:0 0 12px">'+detail+'</pre><p style="font-size:13px;color:#5C6472;margin:0">'+STAMP+'</p></div>';
    }
  }
  window.addEventListener("error", function(e){
    var d = e.error && e.error.stack ? e.error.stack : (e.message || "Unknown error");
    if (e.filename) d += "\n\nSource: " + e.filename + " line " + e.lineno;
    report(d);
  });
  window.addEventListener("unhandledrejection", function(e){ report(String((e.reason && e.reason.stack) || e.reason || "Unhandled rejection")); });
})();
